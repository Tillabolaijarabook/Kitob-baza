<style>
/* 🎨 Ranglar faqat shu yerda */
:root {
  --bg: #13110F; --card: #1E1B18; --card2: #2A2118; --line: #2E2A25; --line2: #4A443D;
  --ink: #F4EFE6; --muted: #A89F92; --soft: #D9CBB4; --accent: #F0B54A; --accent-ink: #1A1408;
  --red: #F2B8A8; --ok: #9FD3A8;
  --serif: "Fraunces", Georgia, serif; --sans: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.45 var(--sans); }
body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px; }
.serif { font-family: var(--serif); font-weight: 700; }
.h1 { font-family: var(--serif); font-weight: 700; font-size: 24px; margin: 0; }
.h2 { font-family: var(--serif); font-weight: 700; font-size: 20px; margin: 0; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.warm { background: var(--card2); border-color: #4A3820; }
.btn { height: 50px; border-radius: 16px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 0 18px; width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line2); }
.btn.sm { height: 38px; border-radius: 12px; font-size: 13px; width: auto; padding: 0 13px; }
.btn.danger { background: transparent; color: var(--red); border: 1px solid #6A3A30; }
.btn:disabled { opacity: .5; }
.chip { flex: 0 0 auto; height: 38px; padding: 0 15px; border-radius: 19px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 13px; }
.chip.on { background: var(--ink); color: var(--accent-ink); border-color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; padding: 4px 8px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
.tag.w { background: var(--ink); } .tag.d { background: var(--bg); color: var(--ink); border: 1px solid #5A5048; }
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.search input { flex: 1; background: transparent; border: 0; outline: 0; font-size: 15px; min-width: 0; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.logo { width: 42px; height: 42px; border-radius: 13px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font: 700 24px var(--serif); overflow: hidden; flex: 0 0 auto; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.pill { height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sec { position: relative; isolation: isolate; overflow: hidden; min-height: 122px; border-radius: 18px; padding: 14px; border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; gap: 4px; background: var(--card); }
.sec b { font-size: 14.5px; margin-top: 6px; } .sec span { font-size: 12px; color: var(--muted); }
.sec .art { position: absolute; right: -8px; bottom: -12px; z-index: -1; }
.covers { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.cov { position: relative; border-radius: 6px 12px 12px 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; color: #F4EFE6; background-size: cover; background-position: center; }
.cov b { font: 700 15px/1.15 var(--serif); text-shadow: 0 1px 6px rgba(0,0,0,.35); } .cov small { font-size: 11px; opacity: .85; margin-top: 4px; }
.cov.img b, .cov.img small { display: none; }
.books { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.bk { text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.bk .tag { position: absolute; top: 10px; left: 10px; }
.bk .t { font-weight: 700; font-size: 14px; line-height: 1.25; } .bk .a { font-size: 12px; color: var(--muted); }
.hero { position: relative; height: 166px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); display: flex; gap: 14px; padding: 16px; text-align: left; width: 100%; color: var(--ink); }
.dots { display: flex; justify-content: center; }
.dots button { width: 28px; height: 28px; border: 0; background: none; display: flex; align-items: center; justify-content: center; }
.dots span { display: block; height: 7px; width: 7px; border-radius: 4px; background: var(--line2); transition: width .3s; }
.dots .on span { width: 20px; background: var(--accent); }
.nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; height: 66px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); z-index: 20; }
.nav button { position: relative; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
.nav button.on { color: var(--accent); }
.nav .badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.tabs button { height: 38px; border-radius: 12px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 12.5px; }
.tabs .on { background: var(--ink); color: var(--accent-ink); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); }
.list { display: flex; flex-direction: column; border-radius: 18px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.list > * { min-height: 52px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 14px; color: var(--ink); }
.list > *:last-child { border-bottom: 0; }
.kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; } .kv span:first-child { color: var(--muted); }
.price2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.price2 > div { padding: 14px; display: flex; flex-direction: column; gap: 3px; } .price2 > div + div { border-left: 1px solid var(--line); }
.big { font-size: 20px; font-weight: 800; }
.spec { display: flex; flex-wrap: wrap; gap: 7px; } .spec span { font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
.foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); z-index: 25; }
.foot .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 24px 24px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--accent-ink); padding: 12px 14px; border-radius: 14px; font-weight: 700; font-size: 13.5px; z-index: 60; }
.field { height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); outline: 0; width: 100%; font-size: 15px; }
textarea.field { height: 110px; padding: 12px 14px; resize: vertical; }
.field:focus { border-color: var(--accent); }
.bubble { max-width: 82%; padding: 11px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
.bubble.me { align-self: flex-end; background: var(--card2); border: 1px solid #4A3820; border-bottom-right-radius: 4px; }
.bubble.them { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.skel { height: 210px; border-radius: 12px; background: linear-gradient(90deg, var(--card), #26221E, var(--card)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.stars button { background: none; border: 0; font-size: 30px; color: var(--accent); padding: 2px 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.qrbox { background: #fff; padding: 18px; border-radius: 18px; align-self: center; }
</style>

<script>
/* =====================================================================
   ⚙️ SOZLASH — faqat shu qatorlarni to'ldiring
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://cyvrjjqzevyqcvxadjay.supabase.co",        // Supabase → Project Settings → Data API → Project URL
  SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5dnJqanF6ZXZ5cWN2eGFkamF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNjI0NTMsImV4cCI6MjEwNjczODQ1M30.cps7FKgc_8btkPswlpRbrGHLtlQOIf7GC2XZlpacLC0",         // Supabase → API Keys → Publishable key (OCHIQ kalit! secret EMAS)
  BOT_USERNAME: "Kitobijarabot",                               // @ belgisisiz
  BRAND_NAME:   "RentBooks",
  LOGO_URL:     "logo.png",
  CHANNEL:      "Rentbooksuz",                                 // rasmiy kanal (@ belgisisiz)
  INSTAGRAM:    "rentbooks.uz"                                 // Instagram sahifa nomi
};
/* ===================================================================== */

(function () {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const BASE = CONFIG.SUPABASE_URL.replace(/\/$/, "");
  const DEMO = BASE.includes("SIZNING");
  const INIT = (tg && tg.initData) || "";

  // ---------- yordamchilar ----------
  const fmt = (n) => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pct = (v) => String(Math.round(Number(v || 0) * 10) / 10).replace(".", ",");
  const MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
  const dt = (v, time) => { if (!v) return "—"; const d = new Date(v); if (isNaN(d)) return String(v).slice(0, 16);
    return d.getDate() + " " + MONTHS[d.getMonth()] + (time ? " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") : ""); };
  const daysLeft = (v) => Math.ceil((new Date(v) - Date.now()) / 864e5);
  const haptic = (t) => { try { if (tg && tg.HapticFeedback) t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
  const cover = (path) => path ? BASE + "/storage/v1/object/public/covers/" + encodeURIComponent(path) : "";
  const PALETTE = ["#6B2E2E", "#23415A", "#3F5A3A", "#4A4038", "#5B3F66", "#2F5A5A", "#7A4E3A"];
  const colorOf = (t) => { let h = 2166136261; for (const ch of String(t)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return PALETTE[(h >>> 0) % PALETTE.length]; };
  const coverHtml = (b, h) => {
    const u = cover(b.cover_path || b.cover);
    return '<div class="cov' + (u ? " img" : "") + '" style="height:' + (h || 210) + 'px;background-color:' + colorOf(b.title) +
      (u ? ";background-image:url('" + u.replace(/'/g, "%27") + "')" : "") + '"><b>' + esc(b.title) + '</b><small>' + esc(b.author || "") + '</small></div>';
  };
  const ERR = {
    BALANCE: "Balansingizda bo'sh summa yetmaydi.", DEBT: "Avval qarzni yoping.", BUSY: "Bu nusxa hozirgina band bo'ldi. Boshqasini tanlang.",
    NO_PHONE: "Avval botda telefon raqamingizni yuboring.", NOT_REGISTERED: "Avval botda ro'yxatdan o'ting.", BANNED: "Hisobingiz bloklangan. Yordamga yozing.",
    TOO_MANY: "Juda tez-tez so'rov. Bir daqiqadan keyin urinib ko'ring.", NOTE_REQUIRED: "Biroz batafsilroq yozing.", PROMO_INVALID: "Promokod topilmadi.",
    PROMO_USED: "Bu promokod ishlatilgan.", PROMO_EXPIRED: "Promokod muddati tugagan.", PROMO_NOT_NEW: "Sotuvda promokod faqat yangi nusxaga.",
    NO_PAYMENTS: "Onlayn to'lov hali ulanmagan. Do'konda naqd to'lashingiz mumkin.", PUL_TOXTATILGAN: "Pul amallari vaqtincha to'xtatilgan.",
    MODE_RENT_ONLY: "Bu kitob faqat ijaraga beriladi.", MODE_SALE_ONLY: "Bu kitob faqat sotiladi.", ALREADY: "Bu amal allaqachon bajarilgan.",
    PREORDER_FREE: "Hozir bo'sh nusxa bor — oddiy bron qiling.", LIMIT: "Bir vaqtda olish mumkin bo'lgan kitoblar soni to'lgan.",
    SERVER: "Serverda xatolik. Birozdan keyin urinib ko'ring.", DB: "Bazada xatolik. Birozdan keyin urinib ko'ring.", NETWORK: "Internet aloqasini tekshiring.",
    BAD_SIGN: "Mini App'ni bot orqali qayta oching.", REVIEW_SHORT: "Sharh juda qisqa.", BAD_AMOUNT: "Summa noto'g'ri.", PAY_LINK: "To'lov oynasini ochib bo'lmadi.",
    DEMO: "Namuna rejimi: CONFIG to'ldirilmagan.", NOT_FOUND: "Topilmadi."
  };
  const errText = (r) => (r && (ERR[r.error] || r.error)) || "Xatolik";

  let toastT;
  function toast(msg) {
    let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => el.style.display = "none", 3400);
  }

  // ---------- baza: katalog (ochiq kalit — faqat katalogni o'qiy oladi) ----------
  async function pub(fn, body) {
    const headers = { apikey: CONFIG.SUPABASE_KEY, "Content-Type": "application/json" };
    if (CONFIG.SUPABASE_KEY.startsWith("eyJ")) headers.Authorization = "Bearer " + CONFIG.SUPABASE_KEY;
    const r = await fetch(BASE + "/rest/v1/rpc/" + fn, { method: "POST", headers, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }
  // ---------- darvoza: mijoz amallari (har so'rovda Telegram imzosi) ----------
  async function api(action, body) {
    if (DEMO) return { ok: false, error: "DEMO" };
    if (!INIT) return { ok: false, error: "BAD_SIGN" };
    try {
      const r = await fetch(BASE + "/functions/v1/app", {
        method: "POST", headers: { "Content-Type": "application/json", "x-init-data": INIT, apikey: CONFIG.SUPABASE_KEY },
        body: JSON.stringify(Object.assign({ action }, body || {}))
      });
      const d = await r.json().catch(() => ({ ok: false, error: "SERVER" }));
      if (d.error === "SIGN_EXPIRED") expired();
      return d;
    } catch (e) { return { ok: false, error: "NETWORK" }; }
  }
  function expired() {
    sheet('<div class="h2">Sessiya eskirdi</div><p class="muted" style="margin:0">Xavfsizlik uchun Mini App vaqti-vaqti bilan qayta ochilishi kerak.</p>' +
      '<button class="btn" id="re">Yopish</button>', (el) => { $("#re", el).onclick = () => tg ? tg.close() : location.reload(); });
  }
  const goBot = (payload) => {
    const link = "https://t.me/" + CONFIG.BOT_USERNAME + (payload ? "?start=" + payload : "");
    if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); setTimeout(() => { try { tg.close(); } catch (e) {} }, 300); } else window.open(link, "_blank");
  };
  const openLink = (l) => {
    if (tg && /^https:\/\/t\.me\//.test(l) && tg.openTelegramLink) tg.openTelegramLink(l);
    else if (tg && tg.openLink) tg.openLink(l); else window.open(l, "_blank");
  };

  // ---------- holat ----------
  let books = [], sets = [], aksiyalar = [], me = null, meErr = null, hideMoney = true;
  const stack = [];
  let screen = "home", param = null, timers = [];

  // ---------- ikonkalar ----------
  const I = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    shelf: '<path d="M4 19V5m5 14V5m5 14l3-14 3 .6-3 14"/>',
    mybook: '<path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h4"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    back: '<path d="M15 6l-6 6 6 6"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
    share: '<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M12 3v13M7 8l5-5 5 5"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    tagi: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>', send: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    clip: '<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>'
  };
  const ic = (n, s, c) => '<svg width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="' + (c || "currentColor") +
    '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + I[n] + '</svg>';

  // ---------- navigatsiya ----------
  const ROOTS = ["home", "catalog", "my", "me"];
  function go(s, p, push) {
    if (push !== false) stack.push([screen, param, window.scrollY]);
    screen = s; param = p == null ? null : p; render(); window.scrollTo(0, 0);
  }
  function back() {
    if ($(".sheet-bg")) { closeSheet(); return; }
    const prev = stack.pop();
    if (!prev) { if (screen !== "home") { screen = "home"; param = null; render(); } return; }
    screen = prev[0]; param = prev[1]; render(); window.scrollTo(0, prev[2] || 0);
  }
  function syncBack() {
    if (!tg || !tg.BackButton) return;
    (ROOTS.includes(screen) && !stack.length && !$(".sheet-bg")) ? tg.BackButton.hide() : tg.BackButton.show();
  }
  function render() {
    timers.forEach(clearInterval); timers = [];
    $("#nav").style.display = screen === "book" ? "none" : "grid";
    drawNav();
    (SCREENS[screen] || SCREENS.home)();
    syncBack();
  }
  function drawNav() {
    const items = [["home", "Bosh sahifa", "home"], ["catalog", "Katalog", "shelf"], ["my", "Kitoblarim", "mybook"], ["me", "Kabinet", "user"]];
    const cnt = me && Number(me.open_count) ? '<span class="badge">' + me.open_count + "</span>" : "";

  // ⚖️ Ijara narxi: botdagi bilan bir xil hisob (chegirma → pastki chegara)
  function rentNet(q, x) { x = Number(x || 0); const a = Number(q.rent_disc_amount || 0); if (a) return Math.max(x - a, 0);
    const p = Number(q.rent_disc_pct || 0); return p ? x - Math.round(x * p / 100) : x; }
  function rentFloor(q, early) { return Math.round(Number(q.fee_total || 0) * Number(early ? q.floor_early_pct || 50 : q.floor_full_pct || 60) / 100 / 100) * 100; }
  const rentNF = (q, x, early) => Math.max(rentNet(q, x), rentFloor(q, early));
  function priceTable(q) {

    const pts = [...new Set([1, 3, 7, 14, 21, Math.floor(days / 2), days])].filter((d) => d >= 1 && d <= days).sort((a, b) => a - b);
    return pts.map((d) => { const cost = d === days ? +q.max_charge : d === 1 ? +q.min_charge : fixed + Math.round(v * d / days * (1 - disc / 100) / 100) * 100;
      const net = rentNF(q, cost, d < days);

  function bookPrivate(b, d) {

      const pay = uf ? rentNF(q, q.max_charge_free) : rentNF(q, q.fee_total);

        '<div class="kv"><span>Kitob</span><b>' + esc(b.title) + "</b></div>" +

        '<div class="kv"><span>Garov (qaytariladi)</span><b>' + (me.premium ? "yo'q ⭐" : fmt(Math.max(q.deposit - pay, 0)) + " so'm") + "</b></div>" +
        '<div class="kv" style="border-top:1px solid var(--line);padding-top:8px"><span>Hozir muzlatiladi</span><b style="color:var(--accent)">' + fmt(me.premium ? pay : q.deposit) + " so'm</b></div>" +

        (free ? '<label class="card row" style="gap:12px"><input type="checkbox" id="uf"' + (uf ? " checked" : "") + ' style="width:22px;height:22px;accent-color:#F0B54A"><span class="small">🎁 ' + q.free_use + " tekin kunni ishlatish (sizda " + q.free_available + " kun)</span></label>" : "") +
        (promoCode ? '<div class="small">🏷 Promokod: <b>' + esc(promoCode) + "</b></div>" : "") +

        '<button class="btn" id="ok">Bron qilish</button>';

  function buySheet(b, c) {

      '<div class="kv"><span>Kitob</span><b>' + esc(b.title) + "</b></div>" +

  async function doBook(action, body, b, q) {
    const btn = $("#ok"); if (btn) { btn.disabled = true; btn.textContent = "Bajarilmoqda…"; }
    const r = await api(action, Object.assign({ pay: "balans" }, body));
    if (r.ok) { haptic("ok"); promoCode = ""; myData = null; doneSheet(action, r, b); refreshMe(); loadCatalog(); return; }
    if (r.error === "BALANCE" && r.cash_full != null) return cashSheet(action, body, b, r, q);
    if (btn) { btn.disabled = false; btn.textContent = "Bron qilish"; }
    toast(errText(r));
  }
  function cashSheet(action, body, b, r, q) {
    const fee = q ? Math.min(rentNF(q, body.use_free ? q.max_charge_free : q.fee_total), +r.need) : null;
    sheet('<div class="h2">Balans yetmaydi</div><div class="card col">' +
      (fee != null ? '<div class="kv"><span>Ijara narxi</span><b>' + fmt(fee) + " so'm</b></div>" + '<div class="kv"><span>Garov (qaytariladi)</span><b>' + fmt(r.need - fee) + " so'm</b></div>" : "") +
      '<div class="kv"><span>Kerak</span><b>' + fmt(r.need) + " so'm</b></div>" + '<div class="kv"><span>Bo\'sh balans</span><b>' + fmt(r.available) + " so'm</b></div></div>" +
      '<button class="btn" id="tp">💳 Balansni to\'ldirish</button>' +
      (r.cash_allowed && r.partial_possible ? '<button class="btn ghost" id="pq">💵 ' + fmt(r.balance_part) + " balansdan + " + fmt(r.cash_part) + " naqd</button>" : "") +
      (r.cash_allowed ? '<button class="btn ghost" id="pn">💵 Hammasini do\'konda naqd: ' + fmt(r.cash_full) + " so'm</button>" +

      $("#tp", el).onclick = () => { closeSheet(); go("topup", Math.max(1000, Math.ceil((r.need - r.available) / 1000) * 1000)); };

      if ($("#pn", el)) $("#pn", el).onclick = () => doBook(action, Object.assign({}, body, { pay: "naqd" }), b, q);

      '<div class="card col" style="align-items:center;gap:4px;padding:18px"><span class="small muted">To\'lanadigan summa</span><span style="font-size:36px;font-weight:800" id="am"></span></div>' +
      '<div class="grid2">' + vals.map((v) => '<button class="chip" data-v="' + v + '" style="height:54px;border-radius:16px;font-size:16px;width:100%">' + fmt(v) + "</button>").join("") + "</div>" +
      '<label class="col"><span class="small muted">Boshqa summa</span><input class="field" id="cu" inputmode="numeric" placeholder="masalan: 35 000"></label>' +
      '<div class="card small col" style="color:var(--soft)"><span>To\'lov Telegram\'ning xavfsiz to\'lov oynasida ochiladi — karta ma\'lumotlari bizga kelmaydi.</span><span class="muted">Balansdagi pul keyingi kitob uchun garov bo\'lib ishlaydi. Do\'konda naqd to\'lash ham mumkin.</span></div>');
    const draw = () => { $("#am").textContent = fmt(amount) + " so'm"; $$("[data-v]", el).forEach((b) => b.classList.toggle("on", +b.dataset.v === amount)); if ($("#pay")) $("#pay").textContent = fmt(amount) + " so'm to'lash"; };
    $$("[data-v]", el).forEach((b) => b.onclick = () => { amount = +b.dataset.v; $("#cu").value = ""; draw(); });
    $("#cu", el).oninput = (e) => { const n = parseInt(e.target.value.replace(/\D/g, ""), 10); if (n) { amount = n; draw(); } };
    foot('<button class="btn" id="pay"></button>', () => { $("#pay").onclick = async () => {
      if (amount < 1000) { toast("Eng kami 1 000 so'm"); return; }
      $("#pay").disabled = true; const r = await api("topup", { amount }); $("#pay").disabled = false;
      if (!r.ok) { toast(errText(r)); return; }
      if (tg && tg.openInvoice) tg.openInvoice(r.link, (status) => {
        if (status === "paid") { haptic("ok"); toast("🎉 To'lov qabul qilindi!"); setTimeout(async () => { await refreshMe(); back(); }, 1800); }
        else if (status === "failed") toast("To'lov amalga oshmadi");
      }); else window.open(r.link);
    }; });
    draw();
  };

  // ---------- 🆘 Yordam ----------
  SCREENS.sos = function () {
    if (!me || !me.ok) return regScreen("Yordam");
    const el = view(head("Yordam", "Adminlarimiz tez orada javob beradi") +
      '<div class="chips">' + ["Bron", "To'lov", "Qaytarish", "Boshqa"].map((t, i) => '<button class="chip' + (i === 0 ? " on" : "") + '" data-tp="' + t + '">' + t + "</button>").join("") + "</div>" +
      '<div class="col" id="chat" style="gap:10px"><div class="skel" style="height:80px"></div></div><div style="height:70px"></div>');
    let topic = "Bron";
    $$("[data-tp]", el).forEach((b) => b.onclick = () => { topic = b.dataset.tp; $$("[data-tp]", el).forEach((x) => x.classList.toggle("on", x === b)); });
    foot('<button class="iconbtn" id="att" aria-label="Rasm yuborish (bot chatida)" style="width:50px;height:50px;border-radius:16px">' + ic("clip") + '</button>' +
      '<label style="flex:1;display:flex"><span class="sr">Xabar</span><input class="field" id="msg" placeholder="Savolingizni yozing…" style="height:50px"></label>' +
      '<button class="btn" id="snd" aria-label="Yuborish" style="width:50px;padding:0;flex:0 0 50px">' + ic("send") + "</button>", () => {
      $("#att").onclick = () => confirmSheet("Rasm yuborish", "Rasm yoki skrinshotni bot chatiga yuborasiz — u ham adminlarga yetadi. Botga o'tasizmi?", async () => goBot("sos"));
      const send = async () => { const t = $("#msg").value.trim(); if (t.length < 2) return;
        $("#snd").disabled = true; const r = await api("sos_send", { text: "[" + topic + "] " + t }); $("#snd").disabled = false;
        if (r.ok) { $("#msg").value = ""; haptic("ok"); loadChat(); } else toast(errText(r)); };
      $("#snd").onclick = send; $("#msg").onkeydown = (e) => { if (e.key === "Enter") send(); };
    });
    loadChat();
    timers.push(setInterval(() => { if (screen === "sos") loadChat(true); }, 20000));
  };
  async function loadChat(quiet) {
    const d = await api("sos_list"); const box = $("#chat"); if (!box) return;
    if (!d.ok) { if (!quiet) box.innerHTML = '<div class="card muted">' + esc(errText(d)) + "</div>"; return; }
    const items = d.items || [];
    if (!items.length) { box.innerHTML = '<div class="empty">Savol, taklif yoki muammoingizni yozing — adminlarimiz javob beradi.</div>'; return; }
    box.innerHTML = items.map((t) => '<div class="bubble me">' + esc(t.text) + '<div class="tiny" style="color:#BFAF96;margin-top:4px;text-align:right">' + dt(t.at, true) + "</div></div>" +
      (t.answers || []).map((a) => '<div class="bubble them">' + esc(a.text) + (String(a.text || "").length >= 120 ? "…" : "") + '<div class="tiny muted" style="margin-top:4px">RentBooks · ' + esc(a.at || "") + "</div></div>").join("") +
      ((t.answers || []).length && t.rating == null && !t.parent ? '<div class="card col" style="align-self:flex-start;gap:8px"><span class="small" style="color:var(--soft)">Javob yordam berdimi?</span><div class="row">' +
        '<button class="btn ghost sm" data-rt="1" data-id="' + t.id + '">Ha, rahmat</button><button class="btn ghost sm" data-rt="-1" data-id="' + t.id + '">Yo\'q</button></div></div>' : "")).join("") +
      '<span class="tiny muted" style="text-align:center">To\'liq javoblar bot chatiga ham keladi.</span>';
    $$("[data-rt]", box).forEach((b) => b.onclick = async () => { const r = await api("sos_rate", { id: +b.dataset.id, rating: +b.dataset.rt }); if (r.ok) { toast("Rahmat!"); loadChat(); } });
    if (!quiet) window.scrollTo(0, document.body.scrollHeight);
  }

  // ---------- 📜 Balans tarixi ----------
  SCREENS.history = async function () {
    if (!me || !me.ok) return regScreen("Balans tarixi");
    view(head("Balans tarixi") + '<div id="hs"><div class="skel" style="height:200px"></div></div>');
    const d = await api("history"); const box = $("#hs"); if (!box) return;
    if (!d.ok) { box.innerHTML = '<div class="card muted">' + esc(errText(d)) + "</div>"; return; }
    box.innerHTML = d.items.length ? '<div class="list">' + d.items.map((r) => { const a = Number(r.summa || 0), hl = Number(r.muzlatish || 0);
      const v = a ? (a > 0 ? "+" : "−") + fmt(Math.abs(a)) : hl ? "🔒 " + (hl > 0 ? "+" : "−") + fmt(Math.abs(hl)) : "0";
      return '<div><span class="col" style="gap:2px"><span style="font-size:13.5px">' + esc(r.turi) + '</span><span class="tiny muted" style="font-weight:500">' + dt(r.vaqt, true) + " · qoldiq " + fmt(r.balans_keyin) +
        '</span></span><b style="color:' + (a > 0 ? "var(--ok)" : "var(--ink)") + '">' + v + "</b></div>"; }).join("") +
      '</div><p class="tiny muted">🔒 — muzlatish: pul balansda qoladi, faqat band turadi.</p>' : '<div class="empty">Hozircha harakat yo\'q.</div>';
  };

  // ---------- 🪪 QR kod ----------
  SCREENS.qr = function () {
    if (!me || !me.ok) return regScreen("Mening QR kodim");
    const el = view(head("Mening QR kodim") + '<div class="qrbox" id="qr"></div><div class="card col" style="text-align:center"><span class="small muted">Mijoz kodi</span><b style="font-size:22px;letter-spacing:.06em">' +
      esc(me.user_code) + '</b></div><p class="small muted" style="margin:0;text-align:center">Do\'konda kitob olayotganda adminga ko\'rsating. Baribir tasdiqlash kodi sizning Telegram\'ingizga keladi — bu QR bilan boshqa odam kitob ololmaydi.</p>');
    try { new QRCode($("#qr", el), { text: "https://t.me/" + CONFIG.BOT_USERNAME + "?start=u_" + me.user_code, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.Q }); }
    catch (e) { $("#qr", el).textContent = me.user_code; }
  };

  // ---------- 📦 To'plamlar ----------
  SCREENS.sets = function () {
    const el = view(head("To'plamlar", "Birga olsangiz arzonroq") + (sets.length ? sets.map((x) =>
      '<button class="card col" data-set="' + x.id + '" style="text-align:left;color:var(--ink)"><div class="row between"><b>' + esc(x.name) + '</b><span class="tag">−' + pct(x.pct) + "%</span></div>" +
      (x.description ? '<span class="small muted">' + esc(x.description) + "</span>" : "") + '<span class="small">' + (x.books || []).map((b) => esc(b.title)).join(" · ") + "</span>" +
      (x.sale && x.sale.possible ? '<span class="small"><s class="muted">' + fmt(x.sale.full) + '</s> <b style="color:var(--accent)">' + fmt(x.sale.price) + " so'm</b></span>" : "") +
      (x.cashback ? '<span class="tiny muted">Ijarada: hammasi o\'z vaqtida qaytarilsa ' + fmt(x.cashback) + " so'm keshbek (bonusga)</span>" : "") + "</button>").join("") : '<div class="empty">Hozircha to\'plamlar yo\'q.</div>'));
    $$("[data-set]", el).forEach((b) => b.onclick = () => confirmSheet("To'plamni rasmiylashtirish", "To'plam xaridi va ijarasi hozircha bot chatida rasmiylashtiriladi. Botga o'tasizmi?", async () => goBot("t_" + b.dataset.set)));
  };

  // ---------- 🙋 so'rov / 📤 taklif ----------
  function formSheet(kind, preset) {
    if (needReg()) return;
    const isReq = kind === "request";
    sheet('<div class="h2">' + (isReq ? "🙋 Kitob so'rash" : "📤 Kitobingizni soting") + '</div><p class="small muted" style="margin:0">' +
      (isReq ? "Katalogda yo'q kitobni yozing — topib kelsak, darhol xabar beramiz." : "O'qib bo'lgan kitobingizni do'konga bering: baholab, pulini balansingizga o'tkazamiz (ijara yoki xaridga ishlatasiz).") + "</p>" +
      '<label class="col"><span class="small muted">' + (isReq ? "Kitob nomi va muallifi" : "Nomi, muallifi, nashr yili va holati") + '</span><textarea class="field" id="tx" placeholder="' +
      (isReq ? "Masalan: Shaytanat, Tohir Malik" : "Masalan: O'tkan kunlar, Qodiriy, 2019, yangiday") + '">' + esc(preset || "") + '</textarea></label><button class="btn" id="sv">Yuborish</button>', (el) => {
      $("#sv", el).onclick = async () => {
        const t = $("#tx", el).value.trim(); if (t.length < 3) { toast("Biroz batafsilroq yozing"); return; }
        $("#sv", el).disabled = true; const r = await api(isReq ? "request" : "offer", { text: t });
        if (!r.ok) { $("#sv", el).disabled = false; toast(errText(r)); return; }
        haptic("ok"); closeSheet(); myData = null;
        if (isReq && r.found) { toast("📚 Bu kitob katalogda bor ekan!"); go("book", r.found.book_id); }
        else toast(isReq ? "✅ So'rov yozildi! Kitob kelishi bilan xabar beramiz." : "✅ Taklif yuborildi! Narxni «Kitoblarim → Navbat»da ko'rasiz.");
      };
    });
  }

  // =====================================================================
  //  YUKLASH
  // =====================================================================
  async function refreshMe() {
    if (DEMO) return;
    if (!INIT) { meErr = "nosign"; return; }
    const d = await api("me");
    if (d.ok && d.registered) { me = d; meErr = null; }
    else { me = null; meErr = d.error || "NO_PHONE"; }
    drawNav();
  }
  async function loadCatalog() {
    if (DEMO) { books = DEMO_BOOKS; return; }
    try { const d = await pub("app_katalog"); books = Array.isArray(d) ? d : []; } catch (e) { if (!books.length) toast("Katalog yuklanmadi — internetni tekshiring"); }
  }
  const DEMO_BOOKS = [
    { id: 1, title: "O'tkan kunlar", author: "Abdulla Qodiriy", genre: "Roman", available: 2, price: 67150, full_price: 79000, rent_fee: 8000, rent_days: 30, aksiya_sale: 15, rent_30: 18, created_at: "2026-09-01", pages: 384, muqova: "Qattiq muqova" },
    { id: 2, title: "Kecha va kunduz", author: "Cho'lpon", genre: "Roman", available: 1, price: 64000, rent_fee: 7000, rent_days: 25, rent_30: 4, created_at: new Date().toISOString() },
    { id: 3, title: "Sariq devni minib", author: "Xudoyberdi To'xtaboyev", genre: "Bolalar", available: 3, price: 52000, rent_fee: 6000, rent_days: 20, rent_30: 9, created_at: "2026-10-10" },
    { id: 4, title: "Ufq", author: "Said Ahmad", genre: "Roman", available: 0, price: null, rent_fee: null, rent_30: 12, created_at: "2026-08-01" }
  ];

  async function start() {
    if (tg) {
      tg.ready(); tg.expand();
      try { tg.setHeaderColor("#13110F"); tg.setBackgroundColor("#13110F"); if (tg.setBottomBarColor) tg.setBottomBarColor("#13110F"); } catch (e) {}
      if (tg.BackButton) tg.BackButton.onClick(back);
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    }
    // boshlang'ich ekran: ?s=book&id=5 (bot tugmasi) yoki startapp=b_5 (havola)
    const qs = new URLSearchParams(location.search);
    let s0 = qs.get("s"), id0 = +qs.get("id") || null;
    const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
    let m;
    if ((m = sp.match(/^b_(\d+)/))) { s0 = "book"; id0 = +m[1]; }
    else if (sp === "aksiya") { s0 = "catalog"; catState.filter = "aksiya"; }
    else if (["my", "me", "topup", "sos", "qr", "catalog"].includes(sp)) s0 = sp;
    screen = "home"; render();
    await Promise.all([loadCatalog(), refreshMe(),
      DEMO ? null : pub("app_aksiyalar").then((d) => { aksiyalar = Array.isArray(d) ? d : []; }).catch(() => {}),
      DEMO ? null : pub("app_toplamlar").then((d) => { sets = Array.isArray(d) ? d : []; }).catch(() => {})]);
    if (s0 === "request" || s0 === "offer") { render(); formSheet(s0); return; }
    if (s0 && SCREENS[s0]) {
      if (!ROOTS.includes(s0)) stack.push(["home", null, 0]);
      screen = s0; param = id0;
    }
    render();
  }
  start();
})();
</script>
</body>
</html>
