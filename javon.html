  function rentNet(q, x) { x = Number(x || 0); const a = Number(q.rent_disc_amount || 0); if (a) return Math.max(x - a, 0);
    const p = Number(q.rent_disc_pct || 0); if (!p) return x;

    const base = part === "doimiy" ? Math.min(f, x) : part === "kunlik" ? Math.max(x - f, 0) : x;

      h += act.map((r) => { const left = daysLeft(r.due), total = Number(r.days) || 30, w = Math.max(5, Math.min(100, 100 - (left / total) * 100));

      if (!act.length) h += '<div class="empty">Qo\'lingizda kitob yo\'q.<br><br><button class="btn ghost sm" data-go="catalog">📚 Katalogga o\'tish</button></div>';

        if (photo || pdf) $("#rmp").onclick = () => { photo = null; pdf = null; drawPrev(); };
      };
      $("#att").onclick = () => fi.click();
      fi.onchange = async () => {
        const f = fi.files && fi.files[0]; fi.value = ""; if (!f) return;
        if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
          if (f.size > 512 * 1024) { toast("📄 PDF 0.5 MB dan katta — qabul qilinmaydi"); return; }
          const data = await new Promise((ok) => { const rd = new FileReader(); rd.onload = () => ok(String(rd.result || "")); rd.onerror = () => ok(""); rd.readAsDataURL(f); });
          let head = ""; try { head = atob(data.split(",")[1] || "").slice(0, 5); } catch (e) {}
          if (head !== "%PDF-") { toast("Bu fayl PDF emas"); return; }
          photo = null; pdf = { name: f.name, size: f.size, data: "data:application/pdf;base64," + data.split(",")[1] }; drawPrev(); $("#msg").focus(); return;
        }
        if (!/^image\//.test(f.type)) { toast("Faqat rasm (skrinshot) yoki PDF yuborish mumkin"); return; }
        try {
          const img = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(f); });
          // 🔒 v31: rasm 0.5 MB dan oshmasin — avval sifat, keyin o'lcham kamaytiriladi
          const MAXB64 = 680000;                       // ≈ 0.5 MB fayl (base64 ≈ 4/3)
          let side = 1600, q = 0.82, out = null;
          for (let i = 0; i < 12; i++) {
            const k = Math.min(1, side / Math.max(img.width, img.height)), cv = document.createElement("canvas");
            cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
            cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
            out = cv.toDataURL("image/jpeg", q);
            if (out.length <= MAXB64) break;
            if (q > 0.55) q -= 0.1; else side = Math.round(side * 0.8);
          }
          if (!out || out.length > MAXB64) { toast("Rasm juda katta (0.5 MB gacha)"); return; }
          photo = out; pdf = null; drawPrev(); $("#msg").focus();

        if (r.ok) { $("#msg").value = ""; photo = null; pdf = null; drawPrev(); haptic("ok"); loadChat(); } else toast(errText(r));
      };
      $("#snd").onclick = send; $("#msg").onkeydown = (e) => { if (e.key === "Enter") send(); };
    });

    timers.push(setInterval(() => { if (screen === "sos") loadChat(true); }, 20000));

      DEMO ? null : pub("app_toplamlar").then((d) => { sets = Array.isArray(d) ? d : []; }).catch(() => {}),
      DEMO ? null : pub("app_zones").then((d) => { zones = Array.isArray(d) ? d : []; }).catch(() => {})]);
    if (s0 === "request" || s0 === "offer") { render(); formSheet(s0); return; }
    if (s0 && SCREENS[s0]) {
      if (!ROOTS.includes(s0)) stack.push(["home", null, 0]);
      screen = s0; param = id0;
    }
    render();
  }
  start();
})();
  // 👁 v31 (U05): har bir parol/PIN maydoniga «ko'rsatish» tugmasi + Caps Lock ogohlantirishi.
  //   Ko'rsatilgan parol 30 soniyadan keyin, maydondan chiqilganda yoki forma yuborilganda o'zi yashiriladi.
  (function () {
    const enh = (inp) => {
      if (inp.dataset.eye) return; inp.dataset.eye = "1";
      const w = document.createElement("span"); w.className = "pw-wrap";
      inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
      const b = document.createElement("button"); b.type = "button"; b.className = "pw-eye";
      w.appendChild(b);
      const numeric = (inp.getAttribute("inputmode") || "") === "numeric";
      let cap = null;
      if (!numeric) { cap = document.createElement("span"); cap.className = "pw-caps"; cap.textContent = "⇪ Caps Lock yoqilgan"; w.appendChild(cap); }
      let t = null;
      const set = (show) => {
        inp.type = show ? "text" : "password"; b.textContent = show ? "🙈" : "👁";
        const l = show ? "Parolni yashirish" : "Parolni ko'rsatish"; b.title = l; b.setAttribute("aria-label", l);
        clearTimeout(t); if (show) t = setTimeout(() => set(false), 30000);
      };
      set(false);
      b.addEventListener("mousedown", (e) => e.preventDefault());          // bosilganda maydon fokusini yo'qotmasin
      if (numeric) {
        // 🔢 v31 (U05.4): PIN — faqat BOSIB TURGANDA ko'rinadi (qo'yib yuborilsa darhol yashirinadi)
        b.title = "Bosib turing — PIN ko'rinadi"; b.setAttribute("aria-label", b.title);
        const on = (e) => { e.preventDefault(); inp.type = "text"; b.textContent = "🙈"; };
        const off = () => { inp.type = "password"; b.textContent = "👁"; };
        b.addEventListener("pointerdown", on); ["pointerup", "pointerleave", "pointercancel", "blur"].forEach((ev) => b.addEventListener(ev, off));
        b.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") on(e); });
        b.addEventListener("keyup", off);
      } else b.addEventListener("click", () => { set(inp.type === "password"); inp.focus(); });
      inp._pwHide = () => { if (inp.type === "text") { if (numeric) { inp.type = "password"; b.textContent = "👁"; } else set(false); } };
      // 💪 v31 (U05.3): yangi parol — kuchliligi ko'rsatkichi (kamida 8 belgi, harf + raqam — server qoidasi bilan bir xil)
      const lbl = ((inp.getAttribute("placeholder") || "") + " " + ((inp.closest("label") || {}).textContent || "")).toLowerCase();
      if (!numeric && inp.getAttribute("autocomplete") === "new-password" && !/takror/.test(lbl)) {
        const m = document.createElement("span"); m.className = "pw-meter"; m.innerHTML = "<i></i><b></b>"; w.appendChild(m);
        const upd = () => {
          const v = inp.value || "";
          let sc = 0;
          if (v.length >= 8) sc++; if (v.length >= 12) sc++;
          if (/[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]/.test(v) && /\d/.test(v)) sc++;
          if (/[a-zа-я]/.test(v) && /[A-ZА-Я]/.test(v)) sc++; if (/[^A-Za-z0-9А-Яа-яЁё]/.test(v)) sc++;
          const ok = v.length >= 8 && /[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]/.test(v) && /\d/.test(v);
          const lv = !v ? 0 : !ok ? 1 : sc >= 4 ? 3 : 2;
          m.dataset.lv = lv;
          m.querySelector("b").textContent = !v ? "" : !ok ? (v.length < 8 ? "Zaif — kamida 8 belgi" : "Zaif — harf va raqam bo'lsin") : lv === 3 ? "Kuchli 💪" : "O'rtacha";
        };
        inp.addEventListener("input", upd); upd();
      }
      inp.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== b && document.activeElement !== inp) set(false); }, 120));
      if (cap) {
        const ck = (e) => { if (e.getModifierState) w.classList.toggle("caps", !!e.getModifierState("CapsLock")); };
        inp.addEventListener("keydown", ck); inp.addEventListener("keyup", ck); inp.addEventListener("blur", () => w.classList.remove("caps"));
      }
      if (inp.form) inp.form.addEventListener("submit", () => set(false));
    };
    const scan = () => document.querySelectorAll('input[type="password"]:not([data-eye])').forEach(enh);
    // U05.2: «Kirish» / «Saqlash» va boshqa tugma bosilganda ko'rsatilgan parollar darhol yashiriladi
    document.addEventListener("click", (e) => {
      const t = e.target && e.target.closest && e.target.closest("button, .btn");
      if (!t || t.classList.contains("pw-eye")) return;
      document.querySelectorAll("input[data-eye]").forEach((i) => { if (i._pwHide) i._pwHide(); });
    }, true);
    let q = 0;
    if (window.MutationObserver) new MutationObserver(() => { if (!q) q = requestAnimationFrame(() => { q = 0; scan(); }); })
      .observe(document.documentElement, { childList: true, subtree: true });
    scan();
  })();
</script>
