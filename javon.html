  function bookPublic(b) {   // ro'yxatdan o'tmagan / namuna rejimi: katalogdagi narxlar

  // ⚖️ Ijara narxi: botdagi bilan bir xil hisob (chegirma → pastki chegara)
  function rentNet(q, x) { x = Number(x || 0); const a = Number(q.rent_disc_amount || 0); if (a) return Math.max(x - a, 0);
    const p = Number(q.rent_disc_pct || 0); return p ? x - Math.round(x * p / 100) : x; }
  function rentFloor(q, early) { return Math.round(Number(q.fee_total || 0) * Number(early ? q.floor_early_pct || 50 : q.floor_full_pct || 60) / 100 / 100) * 100; }
  const rentNF = (q, x, early) => Math.max(rentNet(q, x), rentFloor(q, early));
  function priceTable(q) {
    const days = +q.rental_days, disc = Number(q.discount_percent || 0), fixed = +q.fee_fixed, v = +q.fee_variable;
    const pts = [...new Set([1, 3, 7, 14, 21, Math.floor(days / 2), days])].filter((d) => d >= 1 && d <= days).sort((a, b) => a - b);
    return pts.map((d) => { const cost = d === days ? +q.max_charge : d === 1 ? +q.min_charge : fixed + Math.round(v * d / days * (1 - disc / 100) / 100) * 100;
      const net = rentNF(q, cost, d < days);
      return '<div class="kv"><span>' + d + " kunda qaytarsangiz" + (d === days ? " (muddat oxiri)" : "") + "</span><b>" + (d > 1 && d < days ? "≈ " : "") + fmt(net) + " so'm</b></div>"; }).join("") +
      (Number(q.daily_fine) ? '<div class="kv"><span>Kechiksa, har kuni</span><b>+' + fmt(q.daily_fine) + " so'm</b></div>" : "") +
      '<span class="tiny muted">Chegirma va tekin kunlar bilan ham ijara haqining kamida ' + (q.floor_full_pct || 60) + "% i, erta qaytarsangiz kamida " + (q.floor_early_pct || 50) + "% i olinadi.</span>";
  }

        (canBuy && +sp.full > +sp.price ? '<span class="tiny muted"><s>' + fmt(sp.full) + "</s> · aksiya −" + pct(sp.pct) + "%" + (sp.partial ? " (qisman)" : "") + "</span>" : "") + "</div></div>" +

    $("#bk").innerHTML = '<div class="col" style="gap:12px">' + html + "</div>";
    if ($("#tbl")) $("#tbl").onclick = () => { const o = $("#tblb").style.display === "none"; $("#tblb").style.display = o ? "flex" : "none"; $("#tbla").textContent = o ? "Yopish ▴" : "Ochish ▾"; };
    if ($("#promo")) $("#promo").onclick = () => promoSheet(b, d);
    if ($("#wl")) $("#wl").onclick = async () => { const r = await api("waitlist", { book_id: b.id }); toast(r.ok ? "🔔 Bo'shashi bilan xabar beramiz. Navbatda: " + r.position : errText(r)); if (r.ok) go("book", b.id, false); };
    $$("[data-pre]").forEach((x) => x.onclick = () => confirmSheet("Oldindan to'lab navbatga turish", "Nusxa bo'shashi bilan siz uchun avtomatik bron qilinadi. Summa hozir balansingizda muzlatiladi va istalgan payt bekor qilsangiz bo'shaydi.",
      async () => { const r = await api("preorder", { book_id: b.id, kind: x.dataset.pre });
        if (r.ok) { haptic("ok"); toast("⏳ Navbatga qo'shildingiz: " + r.position + "-o'rin, " + fmt(r.amount) + " so'm muzlatildi"); refreshMe(); myData = null; }

  }

        if (group.getLayers().length) map.fitBounds(group.getBounds(), { padding: [10, 10] }); else map.setView([41.55, 60.63], 12);
        map.on("click", (e) => { addrId = null; setPoint(e.latlng.lat, e.latlng.lng, false); });
        setTimeout(() => map.invalidateSize(), 200);
      }

    const draw = () => { $("#am").textContent = fmt(amount) + " so'm"; $$("[data-v]", el).forEach((b) => b.classList.toggle("on", +b.dataset.v === amount)); if ($("#pay")) $("#pay").textContent = fmt(amount) + " so'm to'lash"; };
    $$("[data-v]", el).forEach((b) => b.onclick = () => { amount = +b.dataset.v; $("#cu").value = ""; draw(); });
    $("#cu", el).oninput = (e) => { const n = parseInt(e.target.value.replace(/\D/g, ""), 10); if (n) { amount = n; draw(); } };
    foot('<button class="btn" id="pay"></button>', () => { $("#pay").onclick = async () => {
      if (amount < 1000) { toast("Eng kami 1 000 so'm"); return; }
      $("#pay").disabled = true; const r = await api("topup", { amount }); $("#pay").disabled = false;
      if (!r.ok) { toast(errText(r)); return; }
      if (tg && tg.openInvoice) tg.openInvoice(r.link, (status) => {
        if (status === "paid") { haptic("ok"); toast("🎉 To'lov qabul qilindi!"); setTimeout(async () => { await refreshMe(); back(); }, 1800); }
        else if (status === "failed") toast("To'lov amalga oshmadi");
      }); else window.open(r.link);
    }; });
    draw();
  };

  // ---------- 🆘 Yordam ----------
  SCREENS.sos = function () {
    if (!me || !me.ok) return regScreen("Yordam");
    const el = view(head("Yordam", "Adminlarimiz tez orada javob beradi") +
      '<div class="chips">' + ["Bron", "To'lov", "Qaytarish", "Boshqa"].map((t, i) => '<button class="chip' + (i === 0 ? " on" : "") + '" data-tp="' + t + '">' + t + "</button>").join("") + "</div>" +
      '<div class="col" id="chat" style="gap:10px"><div class="skel" style="height:80px"></div></div><div style="height:70px"></div>');
    let topic = "Bron";
    $$("[data-tp]", el).forEach((b) => b.onclick = () => { topic = b.dataset.tp; $$("[data-tp]", el).forEach((x) => x.classList.toggle("on", x === b)); });
    foot('<button class="iconbtn" id="att" aria-label="Rasm yuborish" style="width:50px;height:50px;border-radius:16px">' + ic("clip") + '</button>' +
      '<label style="flex:1;display:flex"><span class="sr">Xabar</span><input class="field" id="msg" placeholder="Savolingizni yozing…" style="height:50px"></label>' +
      '<button class="btn" id="snd" aria-label="Yuborish" style="width:50px;padding:0;flex:0 0 50px">' + ic("send") + "</button>", () => {
      // 📷 rasm tanlanganda DARHOL yuborilmaydi: tepada kichik ko'rinishi chiqadi, matn yoziladi, «Yuborish» — ikkalasi birga
      const fi = document.createElement("input"); fi.type = "file"; fi.accept = "image/*"; fi.style.display = "none"; document.body.appendChild(fi);
      let photo = null;
      const prev = document.createElement("div"); prev.style.cssText = "display:none;max-width:560px;margin:0 auto 8px;align-items:center;gap:10px";
      $(".foot").insertBefore(prev, $(".foot .in"));
      const drawPrev = () => {
        prev.style.display = photo ? "flex" : "none";
        prev.innerHTML = photo ? '<img src="' + photo + '" alt="" style="width:54px;height:54px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">' +
          '<span class="small muted" style="flex:1">Rasm biriktirildi — izoh yozib, «Yuborish»ni bosing</span><button class="iconbtn" id="rmp" aria-label="Rasmni olib tashlash" style="width:38px;height:38px">✕</button>' : "";
        if (photo) $("#rmp").onclick = () => { photo = null; drawPrev(); };
      };
      $("#att").onclick = () => fi.click();
      fi.onchange = async () => {
        const f = fi.files && fi.files[0]; fi.value = ""; if (!f) return;
        try {
          const img = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(f); });
          const k = Math.min(1, 1600 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          photo = cv.toDataURL("image/jpeg", 0.82); drawPrev(); $("#msg").focus();
        } catch (e) { toast("Rasmni o'qib bo'lmadi"); }
      };
      const send = async () => {
        const t = $("#msg").value.trim(); if (t.length < 2 && !photo) return;
        $("#snd").disabled = true;
        const r = await api("sos_send", { text: "[" + topic + "] " + (t || "rasm"), image: photo || undefined });
        $("#snd").disabled = false;
        if (r.ok) { $("#msg").value = ""; photo = null; drawPrev(); haptic("ok"); loadChat(); } else toast(errText(r));
      };
      $("#snd").onclick = send; $("#msg").onkeydown = (e) => { if (e.key === "Enter") send(); };
    });
    loadChat();
    timers.push(setInterval(() => { if (screen === "sos") loadChat(true); }, 20000));
  };
  async function loadChat(quiet) {
    const d = await api("sos_list"); const box = $("#chat"); if (!box) return;
    if (!d.ok) { if (!quiet) box.innerHTML = '<div class="card muted">' + esc(errText(d)) + "</div>"; return; }
    const items = d.items || [];
    if (!items.length) { box.innerHTML = '<div class="empty">Savol, taklif yoki muammoingizni yozing — adminlarimiz javob beradi.</div>'; return; }
    box.innerHTML = items.map((t) => '<div class="bubble me">' + (t.photo ? "📷 " : "") + esc(t.text) + '<div class="tiny" style="color:var(--muted);margin-top:4px;text-align:right">' + dt(t.at, true) + "</div></div>" +
      (t.answers || []).map((a) => '<div class="bubble them">' + esc(a.text) + (String(a.text || "").length >= 120 ? "…" : "") + '<div class="tiny muted" style="margin-top:4px">RentBooks · ' + esc(a.at || "") + "</div></div>").join("") +
      ((t.answers || []).length && t.rating == null && !t.parent ? '<div class="card col" style="align-self:flex-start;gap:8px"><span class="small" style="color:var(--soft)">Javob yordam berdimi?</span><div class="row">' +
        '<button class="btn ghost sm" data-rt="1" data-id="' + t.id + '">Ha, rahmat</button><button class="btn ghost sm" data-rt="-1" data-id="' + t.id + '">Yo\'q</button></div></div>' : "")).join("") +
      '<span class="tiny muted" style="text-align:center">To\'liq javoblar bot chatiga ham keladi.</span>';
    $$("[data-rt]", box).forEach((b) => b.onclick = async () => { const r = await api("sos_rate", { id: +b.dataset.id, rating: +b.dataset.rt }); if (r.ok) { toast("Rahmat!"); loadChat(); } });
    if (!quiet) window.scrollTo(0, document.body.scrollHeight);
  }

  // ---------- 📜 Balans tarixi ----------
  SCREENS.history = async function () {
    if (!me || !me.ok) return regScreen("Balans tarixi");
    view(head("Balans tarixi") + '<div id="hs"><div class="skel" style="height:200px"></div></div>');
    const d = await api("history"); const box = $("#hs"); if (!box) return;
    if (!d.ok) { box.innerHTML = '<div class="card muted">' + esc(errText(d)) + "</div>"; return; }
    box.innerHTML = d.items.length ? '<div class="list">' + d.items.map((r) => { const a = Number(r.summa || 0), hl = Number(r.muzlatish || 0);
      const v = a ? (a > 0 ? "+" : "−") + fmt(Math.abs(a)) : hl ? "🔒 " + (hl > 0 ? "+" : "−") + fmt(Math.abs(hl)) : "0";
      return '<div><span class="col" style="gap:2px"><span style="font-size:13.5px">' + esc(r.turi) + '</span><span class="tiny muted" style="font-weight:500">' + dt(r.vaqt, true) + " · qoldiq " + fmt(r.balans_keyin) +
        '</span></span><b style="color:' + (a > 0 ? "var(--ok)" : "var(--ink)") + '">' + v + "</b></div>"; }).join("") +
      '</div><p class="tiny muted">🔒 — muzlatish: pul balansda qoladi, faqat band turadi.</p>' : '<div class="empty">Hozircha harakat yo\'q.</div>';
  };

  // ---------- 🪪 QR kod ----------
  SCREENS.qr = function () {
    if (!me || !me.ok) return regScreen("Mening QR kodim");
    const el = view(head("Mening QR kodim") + '<div class="qrbox" id="qr"></div><div class="card col" style="text-align:center"><span class="small muted">Mijoz kodi</span><b style="font-size:22px;letter-spacing:.06em">' +
      esc(me.user_code) + '</b></div><p class="small muted" style="margin:0;text-align:center">Do\'konda kitob olayotganda adminga ko\'rsating. Baribir tasdiqlash kodi sizning Telegram\'ingizga keladi — bu QR bilan boshqa odam kitob ololmaydi.</p>');
    try { new QRCode($("#qr", el), { text: "https://t.me/" + CONFIG.BOT_USERNAME + "?start=u_" + me.user_code, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.Q }); }
    catch (e) { $("#qr", el).textContent = me.user_code; }
  };

  // ---------- 📦 To'plamlar ----------
  SCREENS.sets = function () {
    const el = view(head("To'plamlar", "Birga olsangiz arzonroq") + (sets.length ? sets.map((x) =>
      '<button class="card col" data-set="' + x.id + '" style="text-align:left;color:var(--ink)"><div class="row between"><b>' + esc(x.name) + '</b><span class="tag">−' + pct(x.pct) + "%</span></div>" +
      (x.description ? '<span class="small muted">' + esc(x.description) + "</span>" : "") + '<span class="small">' + (x.books || []).map((b) => esc(b.title)).join(" · ") + "</span>" +
      (x.sale && x.sale.possible ? '<span class="small"><s class="muted">' + fmt(x.sale.full) + '</s> <b style="color:var(--accent-text)">' + fmt(x.sale.price) + " so'm</b></span>" : "") +
      (x.cashback ? '<span class="tiny muted">Ijarada: hammasi o\'z vaqtida qaytarilsa ' + fmt(x.cashback) + " so'm keshbek (bonusga)</span>" : "") + "</button>").join("") : '<div class="empty">Hozircha to\'plamlar yo\'q.</div>'));
    $$("[data-set]", el).forEach((b) => b.onclick = () => { if (!needReg()) bundleSheet(+b.dataset.set); });
  };
  // 📦 To'plam: sotib olish (sovg'a qadog'i bilan ham) yoki bo'sh kitoblarni ijaraga bron qilish — Mini App ichida
  async function bundleSheet(id) {
    sheet('<div class="skel" style="height:220px"></div>');
    const i = await api("bundle", { id });
    if (!i.ok || !i.active) { closeSheet(); toast("📦 To'plam topilmadi yoki vaqtincha yopilgan."); return; }
    const sale = i.sale || {}, rent = i.rent || {}, gp = Number(i.gift_price || 0);
    let gift = false;
    const draw = () => '<div class="row between"><div class="h2">📦 ' + esc(i.name) + '</div><span class="tag">−' + pct(i.pct) + "%</span></div>" +
      (i.description ? '<p class="small muted" style="margin:0">' + esc(i.description) + "</p>" : "") +
      '<div class="list">' + (i.books || []).map((b) => '<button data-book="' + b.book_id + '"><span>' + esc(b.title) + '</span><span class="small muted" style="font-weight:600">' +
        (b.new_price != null ? fmt(b.new_price) : "") + (b.rent_copy_id ? " · 📖 bo'sh" : "") + "</span></button>").join("") + "</div>" +
      (sale.possible ? '<div class="card col"><div class="kv"><span>Alohida olsangiz</span><s class="muted">' + fmt(sale.full) + ' so\'m</s></div><div class="kv"><b>To\'plam narxi</b><b style="color:var(--accent-text)">' +
        fmt(sale.price) + " so'm</b></div>" + (gp ? '<label class="row small" style="gap:10px"><input type="checkbox" id="gf"' + (gift ? " checked" : "") +
        ' style="width:20px;height:20px;accent-color:#F0B54A">🎁 Sovg\'a qadog\'ida (+' + fmt(gp) + " so'm) — tabrik yozuvi bilan</label>" +
        (gift ? '<textarea class="field" id="gn" placeholder="Tabrik yozuvi (ixtiyoriy)" style="height:80px"></textarea>' : "") : "") +
        '<span class="tiny muted">Hamma kitob yangi nusxa. Summa balansda muzlatiladi va kitoblarni olganingizda yechiladi.</span>' +
        '<button class="btn" id="bb">🛒 To\'plamni sotib olish</button></div>'
        : '<div class="card small muted">🛒 Sotuv uchun hozir to\'plamning hamma kitobidan yangi nusxa yo\'q.</div>') +
      (rent.possible && Number(rent.available_now) ? '<div class="card col"><b>📖 Ijaraga</b><span class="small muted">Hozir ' + rent.available_now + " ta kitob bo'sh · garov " + fmt(rent.deposit_now) +
        " so'm" + (i.cashback ? " · hammasi o'z vaqtida qaytsa " + fmt(i.cashback) + " so'm keshbek (bonusga)" : "") + '</span><button class="btn ghost" id="br">📖 Bo\'sh kitoblarni bron qilish</button></div>' : "");
    const bind = (el) => {
      bindCommon(el);
      if ($("#gf", el)) $("#gf", el).onchange = (e) => { gift = e.target.checked; el.innerHTML = draw(); bind(el); };
      if ($("#bb", el)) $("#bb", el).onclick = () => doBook("bundle_buy", { id, gift, note: $("#gn", el) ? $("#gn", el).value.trim() : "" }, { title: i.name });
      if ($("#br", el)) $("#br", el).onclick = async () => {
        $("#br", el).disabled = true;
        const r = await api("bundle_rent", { id });
        if (r.error === "BALANCE") { topupOffer(r.need); return; }
        if (!r.ok) { $("#br", el).disabled = false; toast(errText(r)); return; }
        haptic("ok"); closeSheet(); myData = null; refreshMe();
        toast("✅ Bron qilindi: " + r.booked.length + " ta" + (r.failed.length ? " · bo'lmadi: " + r.failed.map((x) => x.title).join(", ") : ""));
      };
    };
    $(".sheet").innerHTML = draw(); bind($(".sheet"));
  }

  // ---------- 🙋 so'rov / 📤 taklif ----------
  function formSheet(kind, preset) {
    if (needReg()) return;
    const isReq = kind === "request";
    sheet('<div class="h2">' + (isReq ? "🙋 Kitob so'rash" : "📤 Kitobingizni soting") + '</div><p class="small muted" style="margin:0">' +
      (isReq ? "Katalogda yo'q kitobni yozing — topib kelsak, darhol xabar beramiz." : "O'qib bo'lgan kitobingizni do'konga bering: baholab, pulini balansingizga o'tkazamiz (ijara yoki xaridga ishlatasiz).") + "</p>" +
      '<label class="col"><span class="small muted">' + (isReq ? "Kitob nomi va muallifi" : "Nomi, muallifi, nashr yili va holati") + '</span><textarea class="field" id="tx" placeholder="' +
      (isReq ? "Masalan: Shaytanat, Tohir Malik" : "Masalan: O'tkan kunlar, Qodiriy, 2019, yangiday") + '">' + esc(preset || "") + '</textarea></label><button class="btn" id="sv">Yuborish</button>', (el) => {
      $("#sv", el).onclick = async () => {
        const t = $("#tx", el).value.trim(); if (t.length < 3) { toast("Biroz batafsilroq yozing"); return; }
        $("#sv", el).disabled = true; const r = await api(isReq ? "request" : "offer", { text: t });
        if (!r.ok) { $("#sv", el).disabled = false; toast(errText(r)); return; }
        haptic("ok"); closeSheet(); myData = null;
        if (isReq && r.found) { toast("📚 Bu kitob katalogda bor ekan!"); go("book", r.found.book_id); }
        else toast(isReq ? "✅ So'rov yozildi! Kitob kelishi bilan xabar beramiz." : "✅ Taklif yuborildi! Narxni «Kitoblarim → Navbat»da ko'rasiz.");
      };
    });
  }

  // =====================================================================
  //  YUKLASH
  // =====================================================================
  async function refreshMe() {
    if (DEMO) return;
    if (!INIT) { meErr = "nosign"; return; }
    const d = await api("me");
    if (d.ok && d.registered) { me = d; meErr = null; }
    else { me = null; meErr = d.error || "NO_PHONE"; }
    drawNav();
  }
  async function loadCatalog() {
    if (DEMO) { books = DEMO_BOOKS; return; }
    try { const d = await pub("app_katalog"); books = Array.isArray(d) ? d : []; } catch (e) { if (!books.length) toast("Katalog yuklanmadi — internetni tekshiring"); }
  }
  const DEMO_BOOKS = [
    { id: 1, title: "O'tkan kunlar", author: "Abdulla Qodiriy", genre: "Roman", available: 2, price: 67150, full_price: 79000, rent_fee: 8000, rent_days: 30, aksiya_sale: 15, rent_30: 18, created_at: "2026-09-01", pages: 384, muqova: "Qattiq muqova" },
    { id: 2, title: "Kecha va kunduz", author: "Cho'lpon", genre: "Roman", available: 1, price: 64000, rent_fee: 7000, rent_days: 25, rent_30: 4, created_at: new Date().toISOString() },
    { id: 3, title: "Sariq devni minib", author: "Xudoyberdi To'xtaboyev", genre: "Bolalar", available: 3, price: 52000, rent_fee: 6000, rent_days: 20, rent_30: 9, created_at: "2026-10-10" },
    { id: 4, title: "Ufq", author: "Said Ahmad", genre: "Roman", available: 0, price: null, rent_fee: null, rent_30: 12, created_at: "2026-08-01" }
  ];

  function applyTheme() {   // 🌗 Telegram rejimi: dark → qora, light → oq
    const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); if (tg.setBottomBarColor) tg.setBottomBarColor(bg); } catch (e) {}
  }
  if (!tg && window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    document.documentElement.setAttribute("data-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); });

  async function start() {
    if (tg) {
      tg.ready(); tg.expand();
      applyTheme();
      tg.onEvent && tg.onEvent("themeChanged", () => { applyTheme(); render(); });
      if (tg.BackButton) tg.BackButton.onClick(back);
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    }
    // boshlang'ich ekran: ?s=book&id=5 (bot tugmasi) yoki startapp=b_5 (havola)
    const qs = new URLSearchParams(location.search);
    let s0 = qs.get("s"), id0 = +qs.get("id") || null;
    const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
    let m;
    if ((m = sp.match(/^b_(\d+)/))) { s0 = "book"; id0 = +m[1]; }
    else if (sp === "aksiya") { s0 = "catalog"; catState.filter = "aksiya"; }
    else if (["my", "me", "topup", "sos", "qr", "catalog"].includes(sp)) s0 = sp;
    screen = "home"; render();
    const vb = document.createElement("div"); vb.textContent = APP_VER + (DEMO ? " · ⚙️ CONFIG to'ldirilmagan" : "");
    vb.style.cssText = "text-align:center;font-size:10.5px;color:var(--muted);padding:4px 0 " + (DEMO ? "8px" : "0"); document.body.appendChild(vb);
    if (DEMO && INIT) toast("⚙️ CONFIG to'ldirilmagan yoki fayl hali yangilanmagan — 2–3 daqiqa kutib, qayta oching");
    await Promise.all([loadCatalog(), refreshMe(),
      DEMO ? null : pub("app_aksiyalar").then((d) => { aksiyalar = Array.isArray(d) ? d : []; }).catch(() => {}),
      DEMO ? null : pub("app_toplamlar").then((d) => { sets = Array.isArray(d) ? d : []; }).catch(() => {}),
      DEMO ? null : pub("app_zones").then((d) => { zones = Array.isArray(d) ? d : []; }).catch(() => {})]);
    if (s0 === "request" || s0 === "offer") { render(); formSheet(s0); return; }
    if (s0 && SCREENS[s0]) {
      if (!ROOTS.includes(s0)) stack.push(["home", null, 0]);
      screen = s0; param = id0;
    }
    render();
  }
  start();
})();
</script>
</body>
