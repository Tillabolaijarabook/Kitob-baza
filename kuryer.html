<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kuryer xaritasi — RentBooks</title>
<!-- VERSIYA: v22 — 🛵 kuryer xaritasi (faqat kuryer; bot «🚚 Mening yetkazishlarim» dan ochiladi) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root { --bg:#F7F3EC; --card:#fff; --line:#E6DDD0; --ink:#1F1A14; --muted:#6B6155; --accent:#F0B54A; --accent-ink:#2A1E08;
        --blue:#2F6FD0; --red:#B03A26; --ok:#2C7A45; color-scheme: light; }
:root[data-theme="dark"] { --bg:#13110F; --card:#1E1B18; --line:#2E2A25; --ink:#F4EFE6; --muted:#A89F92; --blue:#7FAEF5;
                           --red:#F2B8A8; --ok:#9FD3A8; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 500 14.5px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 720px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
h1 { font-size: 19px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.small { font-size: 12.5px; } .muted { color: var(--muted); }
#map { height: 46vh; min-height: 280px; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { padding: 7px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; }
.sum { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.num { min-width: 30px; height: 30px; border-radius: 15px; background: var(--accent); color: var(--accent-ink); display: inline-flex;
       align-items: center; justify-content: center; font-weight: 800; }
.leg { color: var(--blue); font-weight: 700; font-size: 12.5px; }
a { color: var(--blue); }
.pin { background: var(--accent); color: var(--accent-ink); border: 2px solid #fff; border-radius: 50%; width: 30px; height: 30px;
       display: flex; align-items: center; justify-content: center; font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.pin.go { background: var(--ok); color: #fff; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: #222; color: #fff;
         padding: 12px 14px; border-radius: 14px; display: none; z-index: 2000; max-width: 696px; margin: 0 auto; }
.toast button { margin-left: 8px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
.live { font-size: 12px; font-weight: 700; color: var(--muted); }
.live.on { color: var(--ok); }
.next { background: var(--card); border: 2px solid var(--ok); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row between"><h1>🛵 Mening yetkazishlarim</h1><button class="btn ghost sm" id="reload">🔄</button></div>
  <div id="map"></div>
  <div class="row">
    <button class="btn" id="best">🧭 Eng yaxshi yo'nalish</button>
    <button class="btn ghost" id="me">📍 Men qayerdaman</button>
    <span class="live" id="live">📡 joylashuv: kutilmoqda</span>
  </div>
  <label class="chk" id="backw" style="display:none"><input type="checkbox" id="back"> 🏪 Oxirida do'konga qaytish</label>
  <div id="next"></div>
  <div class="sum" id="sum" style="display:none"></div>
  <div id="list" class="col"></div>
  <div class="small muted" style="text-align:center">Mijozni tanlab «🧭 Yo'nalish» ni bossangiz, unga 2 daqiqadan keyin «Kuryer yo'lda» xabari o'zi boradi.</div>
</div>
<div class="toast" id="toast"></div>
<div id="ver" class="small muted" style="text-align:center;padding:4px 0 14px"></div>
<script>
/* ⚙️ SOZLASH — javon.html va zona.html dagi bilan bir xil 2 qator */
const CONFIG = {
  SUPABASE_URL: "https://cyvrjjqzevyqcvxadjay.supabase.co",
  SUPABASE_KEY: "sb_publishable_SIZNING_OCHIQ_KALIT"
};
(function () {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  document.documentElement.setAttribute("data-theme", tg && tg.colorScheme === "dark" ? "dark" : "light");
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (n) => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const km = (m) => (Number(m) / 1000).toFixed(1).replace(".", ",") + " km";
  const mins = (s) => Math.max(1, Math.round(Number(s) / 60)) + " daq";
  const BASE = CONFIG.SUPABASE_URL.replace(/\/$/, "");
  const APP_VER = "v22";
  const CFG_BAD = /SIZNING/.test(CONFIG.SUPABASE_URL) || /SIZNING/.test(CONFIG.SUPABASE_KEY);
  const OSRM = "https://router.project-osrm.org";
  const ERR = { NOT_COURIER: "⛔ Bu sahifa faqat faol kuryerlar uchun.", NOT_YOURS: "🔒 Bu yetkazish sizga biriktirilmagan.",
    ALREADY: "ℹ️ Yetkazish yopilgan yoki o'zgargan — ro'yxatni yangilang.", CONFIG: "⚙️ kuryer.html ichidagi CONFIG to'ldirilmagan.",
    NO_TG: "Sahifani botdagi «🚚 Mening yetkazishlarim» → «🗺 Hammasini xaritada ko'rish» orqali oching.",
    OFFLINE: "📶 Internet aloqasi yo'q.", GATEWAY: "🔌 Darvozaga ulanib bo'lmadi.", TOO_MANY: "⏳ Juda tez — bir oz kuting.",
    UNKNOWN_ACTION: "🔄 Darvoza eski: Supabase → Edge Functions → app ga v20 index.ts ni joylang (Deploy).",
    BAD_SIGN: "🔐 Imzo tekshirilmadi. Sahifani bot orqali qayta oching.", SIGN_EXPIRED: "Sahifani yopib, qayta oching.",
    ADMIN_BLOK: "⛔ Siz bloklangansiz (PIN). Superadminga murojaat qiling." };
  const errText = (r) => ERR[r && r.error] || (r && r.error) || "Xatolik";
  let tt;
  function toast(html, ms) {
    const t = $("#toast"); t.innerHTML = html; t.style.display = "block"; clearTimeout(tt);
    if (ms !== 0) tt = setTimeout(() => { t.style.display = "none"; }, ms || 3500);
  }
  async function api(action, body) {
    if (CFG_BAD) return { ok: false, error: "CONFIG" };
    if (!tg || !tg.initData) return { ok: false, error: "NO_TG" };
    let r;
    try {
      r = await fetch(BASE + "/functions/v1/app", { method: "POST",
        headers: { "Content-Type": "application/json", "x-init-data": tg.initData, apikey: CONFIG.SUPABASE_KEY },
        body: JSON.stringify(Object.assign({ action }, body || {})) });
    } catch (e) { return { ok: false, error: navigator.onLine === false ? "OFFLINE" : "GATEWAY" }; }
    try { return await r.json(); } catch (e) { return { ok: false, error: "HTTP_" + r.status }; }
  }
  const openLink = (u) => { if (tg && tg.openLink) tg.openLink(u); else window.open(u, "_blank"); };
  const yandexRoute = (x) => "https://yandex.uz/maps/?rtext=" + (here ? here[0] + "," + here[1] : "") + "~" + x.lat + "," + x.lon + "&rtt=auto";
  function haversine(a, b) {
    const R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function decodePolyline(str) {          // Google polyline (aniqlik 5) — ORS optimization geometriyasi
    let i = 0, lat = 0, lon = 0; const out = [];
    while (i < str.length) {
      for (const k of [0, 1]) {
        let b, shift = 0, res = 0;
        do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const d = (res & 1) ? ~(res >> 1) : (res >> 1);
        if (k === 0) lat += d; else lon += d;
      }
      out.push([lat / 1e5, lon / 1e5]);
    }
    return out;
  }

  // ---------- xarita ----------
  $("#ver").textContent = APP_VER + (CFG_BAD ? " · ⚙️ CONFIG to'ldirilmagan" : "");
  const map = L.map("map", { zoomControl: true });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  map.setView([41.55, 60.63], 12);
  const pins = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
  let items = [], here = null, hereMarker = null, order = null, legs = {}, selected = null;
  let stores = [], storeMarker = null;                   // 🏬 v22: do'kon nuqtasi (oxirida qaytish uchun)
  const storeFor = () => {                               // kuryerga eng yaqin faol do'kon
    if (!stores.length) return null;
    if (!here) return stores[0];
    return stores.slice().sort((a, b) => haversine(here, [a.lat, a.lon]) - haversine(here, [b.lat, b.lon]))[0];
  };

  function pinIcon(n, going) {
    return L.divIcon({ className: "", html: '<div class="pin' + (going ? " go" : "") + '">' + n + "</div>", iconSize: [30, 30], iconAnchor: [15, 15] });
  }
  function listOrder() {                  // eng yaxshi tartib bo'lsa — o'sha; aks holda menga eng yaqin birinchi
    if (order) return order.map((id) => items.find((x) => x.id === id)).filter(Boolean)
      .concat(items.filter((x) => !order.includes(x.id)));
    if (here) return items.slice().sort((a, b) => haversine(here, [a.lat, a.lon]) - haversine(here, [b.lat, b.lon]));
    return items.slice();
  }
  // ▶️ v22: navbatdagi mijoz — eng yaxshi tartib bo'lsa undagi birinchisi, aks holda eng yaqini
  function drawNext(arr) {
    const el = $("#next");
    if (!arr.length) {
      const st = storeFor();
      el.innerHTML = st && items.length === 0 && loaded ? '<div class="next"><b>✅ Hamma yetkazildi</b><div class="row">' +
        '<button class="btn sm" id="gostore">🏪 ' + esc(st.name) + "ga yo'l</button></div></div>" : "";
      const g = $("#gostore"); if (g) g.onclick = () => needHere(() => drawRoute({ id: -1, lat: st.lat, lon: st.lon }, false));
      return;
    }
    const x = arr[0];
    el.innerHTML = '<div class="next"><span class="small muted">▶️ Navbatdagi mijoz</span><b>' + esc(x.name) + "</b>" +
      (x.address ? '<span class="small">📍 ' + esc(x.address) + "</span>" : "") +
      '<div class="row"><button class="btn sm" id="nx_go">🧭 Yo\'nalish</button>' +
      (x.phone ? '<a class="btn ghost sm" href="tel:' + esc(String(x.phone).replace(/[^\d+]/g, "")) + '">📞 Qo\'ng\'iroq</a>' : "") + "</div></div>";
    $("#nx_go").onclick = () => routeTo(x.id);
  }
  function draw() {
    pins.clearLayers();
    const arr = listOrder();
    drawNext(arr);
    arr.forEach((x, i) => {
      const m = L.marker([x.lat, x.lon], { icon: pinIcon(i + 1, x.going) }).addTo(pins);
      m.on("click", () => select(x.id, true));
    });
    if (!arr.length) { $("#list").innerHTML = '<div class="empty">Hozir sizda yetkaziladigan buyurtma yo\'q.<br>Do\'kondan kitob olgach, mijozlar shu yerda chiqadi.</div>'; return; }
    $("#list").innerHTML = arr.map((x, i) => {
      const leg = legs[x.id];
      const dist = !leg && here ? "📏 to'g'ri chiziq bo'yicha ~" + km(haversine(here, [x.lat, x.lon])) : "";
      return '<div class="card' + (selected === x.id ? " sel" : "") + '" data-id="' + x.id + '">' +
        '<div class="row between"><div class="row"><span class="num">' + (i + 1) + "</span><b>" + esc(x.name) + "</b></div>" +
        (x.going_sent ? '<span class="small" style="color:var(--ok)">🛵 xabar ketgan</span>' : x.going ? '<span class="small muted">⏳ xabar ketmoqda</span>' : "") + "</div>" +
        (x.address ? '<span>📍 ' + esc(x.address) + ' <span class="small muted">(taxminiy)</span></span>' : "") +
        (x.note ? '<span>📝 ' + esc(x.note) + "</span>" : "") +
        (x.phone ? '<span>📞 <a href="tel:' + esc(String(x.phone).replace(/[^\d+]/g, "")) + '">' + esc(x.phone) + "</a></span>" : "") +
        '<span class="small">📚 ' + x.books + " ta kitob · " + (Number(x.cash) ? "💵 olinadi: <b>" + fmt(x.cash) + " so'm</b>" : "💳 to'langan") + "</span>" +
        (leg ? '<span class="leg">' + (leg.d != null ? "🛣 " + km(leg.d) + " · " : "") + "⏱ " + mins(leg.t) + (leg.from ? " (oldingi nuqtadan)" : " (sizdan)") + "</span>" : dist ? '<span class="small muted">' + dist + "</span>" : "") +
        '<div class="row"><button class="btn sm" data-go="' + x.id + '">🧭 Yo\'nalish</button>' +
        '<button class="btn ghost sm" data-ya="' + x.id + '">📱 Yandex\'da</button></div></div>';
    }).join("");
    document.querySelectorAll("[data-id]").forEach((c) => c.onclick = (e) => { if (!e.target.closest("button,a")) select(+c.dataset.id, false); });
    document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => routeTo(+b.dataset.go));
    document.querySelectorAll("[data-ya]").forEach((b) => b.onclick = () => { const x = items.find((y) => y.id === +b.dataset.ya); if (x) openLink(yandexRoute(x)); });
  }
  function select(id, scroll) {
    selected = id; const x = items.find((y) => y.id === id); draw();
    if (x) map.setView([x.lat, x.lon], Math.max(map.getZoom(), 15));
    if (scroll) { const c = document.querySelector('[data-id="' + id + '"]'); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }
  function fitAll() {
    const pts = items.map((x) => [x.lat, x.lon]).concat(here ? [here] : []);
    if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
  }

  // ---------- 📍 joylashuv (v22: Telegram LocationManager + doimiy kuzatish) ----------
  //   1) brauzer watchPosition — kuryer yurganda ko'k nuqta o'zi siljiydi;
  //   2) ishlamasa — Telegram LocationManager (Bot API 8.0+) har 15 soniyada so'raladi.
  let watchId = null, lmTimer = null, lastFix = 0, lastDraw = 0;
  const LM = tg && tg.LocationManager;
  function setHere(lat, lon) {
    here = [lat, lon]; lastFix = Date.now();
    if (hereMarker) hereMarker.setLatLng(here);
    else hereMarker = L.circleMarker(here, { radius: 9, color: "#fff", weight: 3, fillColor: "#2F6FD0", fillOpacity: 1 }).addTo(map);
    $("#live").textContent = "📡 joylashuv: jonli"; $("#live").className = "live on";
    if (Date.now() - lastDraw > 15000 && !order) { lastDraw = Date.now(); draw(); }   // yaqinlik tartibi yangilanadi
    follow();
  }
  function lmAsk(cb, quiet) {
    if (!LM) return cb && cb(false);
    const get = () => LM.getLocation((loc) => {
      if (loc && Number.isFinite(loc.latitude)) { setHere(loc.latitude, loc.longitude); cb && cb(true); }
      else {
        if (!quiet) toast("📍 Joylashuvga ruxsat bering: " + '<button class="btn sm" id="lmset">Sozlamalar</button>', 8000);
        const b = $("#lmset"); if (b) b.onclick = () => { try { LM.openSettings(); } catch (e) {} };
        cb && cb(false);
      }
    });
    if (LM.isInited) get(); else LM.init(get);
  }
  function startWatch() {
    if (navigator.geolocation && watchId == null) {
      watchId = navigator.geolocation.watchPosition((p) => setHere(p.coords.latitude, p.coords.longitude),
        () => { if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; } startLm(); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
    } else startLm();
  }
  function startLm() {
    if (!LM || lmTimer) return;
    lmTimer = setInterval(() => lmAsk(null, true), 15000);
  }
  setInterval(() => {                                   // 1 daqiqadan beri yangi nuqta yo'q — belgi xira
    if (lastFix && Date.now() - lastFix > 60000) { $("#live").textContent = "📡 joylashuv: eskirgan"; $("#live").className = "live"; }
  }, 20000);
  function locate(cb) {
    const done = () => { if (cb) cb(); else { draw(); fitAll(); } };
    let finished = false;
    const fin = () => { if (!finished) { finished = true; done(); } };
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition((p) => { setHere(p.coords.latitude, p.coords.longitude); fin(); },
        () => lmAsk((ok) => { if (ok) fin(); else if (!LM) toast("📍 Joylashuvga ruxsat bering (Telegram sozlamalari) — yo'nalish shundan hisoblanadi."); }),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 });
    } else lmAsk((ok) => { if (ok) fin(); else toast("📍 Telefon joylashuvni bermayapti — yo'nalish uchun kerak."); });
    startWatch();
  }
  const needHere = (fn) => here ? fn() : locate(fn);

  // 🧭 v22: tanlangan mijozga yo'l — kuryer 150 m dan ko'p siljisa, ko'pi bilan 45 soniyada bir qayta chiziladi
  let target = null, targetAt = 0, targetFrom = null;
  function follow() {
    if (!target || !here || !targetFrom) return;
    if (Date.now() - targetAt < 45000 || haversine(here, targetFrom) < 150) return;
    const x = items.find((y) => y.id === target); if (!x) { target = null; return; }
    drawRoute(x, true);
  }

  // ---------- 🧭 bitta mijozga yo'nalish (+ «kuryer yo'lda» xabari) ----------
  async function drawRoute(x, quiet) {
      target = x.id; targetAt = Date.now(); targetFrom = here.slice();
      if (!quiet) toast("🧭 Yo'nalish hisoblanmoqda…", 0);
      let line = null, dist = 0, dur = 0;
      const r = await api("admin_route", { from: here, to: [x.lat, x.lon] });
      if (r && r.ok) { line = r.line; dist = r.distance; dur = r.duration; }
      else {
        try {                              // kalit yo'q / xizmat javob bermadi — kalitsiz OSRM
          const j = await (await fetch(OSRM + "/route/v1/driving/" + here[1] + "," + here[0] + ";" + x.lon + "," + x.lat + "?overview=full&geometries=geojson")).json();
          const rt = j.routes && j.routes[0];
          if (rt) { line = rt.geometry.coordinates.map((c) => [c[1], c[0]]); dist = rt.distance; dur = rt.duration; }
        } catch (e) {}
      }
      routeLayer.clearLayers();
      if (line) {
        L.polyline(line, { color: "#2F6FD0", weight: 6, opacity: .85 }).addTo(routeLayer);
        if (!quiet) map.fitBounds(line, { padding: [30, 30] });
        legs = {}; legs[x.id] = { d: dist, t: dur, from: false }; if (!quiet) order = null;
      } else {
        dist = haversine(here, [x.lat, x.lon]); dur = dist / 8;      // ~30 km/soat — taxminiy
        legs = {}; legs[x.id] = { d: dist, t: dur, from: false };
        if (!quiet) toast("ℹ️ Yo'nalish xizmati javob bermadi — to'g'ri chiziq bo'yicha taxminiy masofa ko'rsatildi.");
      }
      selected = x.id; draw();
      if (quiet) return dur;
      if (line) $("#toast").style.display = "none";
      return dur;
  }
  async function routeTo(id) {
    const x = items.find((y) => y.id === id); if (!x) return;
    needHere(async () => {
      const dur = await drawRoute(x, false);
      // 🛵 mijozga «Kuryer yo'lda» (bir marta; 2 daqiqa ichida bekor qilish mumkin)
      if (!x.going_sent) {
        const g = await api("admin_courier_go", { id: x.id, eta_min: Math.round(dur / 60) });
        if (g && g.ok && !g.sent) {
          x.going = true; draw();
          const sec = Number(g.send_in_sec) || 120;
          toast("🛵 " + Math.round(sec / 60) + " daqiqadan keyin <b>" + esc(x.name) + "</b> ga «Kuryer yo'lda» xabari ketadi." +
                ' <button class="btn sm" id="undo">↩️ Ketmasin</button>', sec * 1000);
          const u = $("#undo");
          if (u) u.onclick = async () => {
            const c = await api("admin_courier_go_cancel", { id: x.id });
            x.going = false; draw(); toast(c && c.ok ? "↩️ Bekor qilindi — xabar ketmaydi." : "ℹ️ Xabar allaqachon ketgan.");
          };
        } else if (g && !g.ok) toast(errText(g));
        else $("#toast").style.display = "none";
      } else $("#toast").style.display = "none";
    });
  }

  // ---------- 🧭 eng yaxshi tartib (oxirgi mijozda tugaydi) ----------
  async function best() {
    if (items.length < 1) return;
    needHere(async () => {
      $("#best").disabled = true; toast("🧭 Eng yaxshi tartib hisoblanmoqda…", 0);
      let ids = null, line = null, total = 0, totalD = null, legMap = {};
      const st = $("#back") && $("#back").checked ? storeFor() : null;
      const r = await api("admin_route_best", { from: here, stops: items.map((x) => ({ id: x.id, lat: x.lat, lon: x.lon })),
                                                end: st ? [st.lat, st.lon] : null });
      if (r && r.ok && r.order && r.order.length) {
        ids = r.order.map((s) => +s.id); total = r.duration; totalD = r.distance;
        let prevT = 0, prevD = 0;
        r.order.forEach((s, i) => {
          const d = s.distance != null ? s.distance - prevD : null;
          legMap[+s.id] = { d: d, t: s.arrival - prevT, from: i > 0 };
          prevT = s.arrival; if (s.distance != null) prevD = s.distance;
        });
        if (r.geometry) line = decodePolyline(r.geometry);
      } else {
        try {                              // kalitsiz OSRM trip
          const pts = [here].concat(items.map((x) => [x.lat, x.lon])).concat(st ? [[st.lat, st.lon]] : []);
          const coords = pts.map((p) => p[1] + "," + p[0]).join(";");
          const j = await (await fetch(OSRM + "/trip/v1/driving/" + coords + "?source=first" + (st ? "&destination=last" : "") +
                                       "&roundtrip=false&overview=full&geometries=geojson")).json();
          const t = j.trips && j.trips[0];
          if (t) {
            const pos = j.waypoints.map((w, i) => ({ i, k: w.waypoint_index })).sort((a, b) => a.k - b.k);
            ids = pos.filter((p) => p.i > 0 && p.i <= items.length).map((p) => items[p.i - 1].id);
            ids.forEach((id, n) => { const lg = t.legs[n]; if (lg) legMap[id] = { d: lg.distance, t: lg.duration, from: n > 0 }; });
            total = t.duration; totalD = t.distance; line = t.geometry.coordinates.map((c) => [c[1], c[0]]);
          }
        } catch (e) {}
      }
      $("#best").disabled = false;
      if (!ids) {                          // ikkalasi ham ishlamadi — yaqinlik bo'yicha
        order = null; legs = {}; routeLayer.clearLayers(); draw();
        toast("ℹ️ Yo'nalish xizmati javob bermadi — ro'yxat sizga eng yaqin mijozdan boshlab tartiblandi.");
        return;
      }
      order = ids; legs = legMap; routeLayer.clearLayers();
      if (line) { L.polyline(line, { color: "#2F6FD0", weight: 6, opacity: .8 }).addTo(routeLayer); map.fitBounds(line, { padding: [30, 30] }); }
      $("#sum").style.display = "block";
      $("#sum").textContent = "🛣 " + (totalD != null ? km(totalD) + " · " : "") + "⏱ " + mins(total) + " · " + ids.length + " ta mijoz" +
        (st ? " + 🏪 " + st.name : "") + " (tirbandliksiz, taxminiy)";
      $("#toast").style.display = "none"; draw();
    });
  }

  // ---------- yuklash ----------
  let loaded = false;
  async function load(keep) {
    const r = await api("admin_courier_map");
    if (!r || !r.ok) { if (!keep) $("#list").innerHTML = '<div class="empty">' + esc(errText(r)) + "</div>"; return; }
    const before = items.map((x) => x.id).join(",");
    items = (r.items || []).map((x) => Object.assign({}, x, { lat: +x.lat, lon: +x.lon }));
    stores = (r.stores || []).map((x) => Object.assign({}, x, { lat: +x.lat, lon: +x.lon }));
    $("#backw").style.display = stores.length ? "flex" : "none";
    if (storeMarker) { map.removeLayer(storeMarker); storeMarker = null; }
    if (stores.length) {
      storeMarker = L.layerGroup(stores.map((st) => L.marker([st.lat, st.lon], { icon: L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: '<div class="pin" style="background:#fff">🏪</div>' }) }).bindTooltip(esc(st.name)))).addTo(map);
    }
    loaded = true;
    if (keep && before === items.map((x) => x.id).join(",")) return;     // o'zgarish yo'q — chiziq va tartib saqlanadi
    if (keep && order) {                                  // yetkazilganlar tartibdan chiqadi, qolganlari o'z o'rnida
      order = order.filter((id) => items.some((x) => x.id === id));
      if (target && !items.some((x) => x.id === target)) { target = null; routeLayer.clearLayers(); }
      draw(); return;
    }
    order = null; legs = {}; target = null; routeLayer.clearLayers(); $("#sum").style.display = "none";
    draw(); fitAll();
  }
  setInterval(() => { if (document.visibilityState === "visible") load(true); }, 60000);   // har daqiqada ro'yxat yangilanadi
  $("#reload").onclick = () => load();
  $("#me").onclick = () => locate();
  $("#best").onclick = () => best();
  load().then(() => locate());
})();
</script>
</body>
</html>
