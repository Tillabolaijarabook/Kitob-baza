  const store = {

    clear() { try { localStorage.removeItem("rb_admin"); } catch (e) {} },
  };
  let S = store.get(), ME = S ? S.me : null;
  async function api(action, body) {
    let r;
    try {
      // «oddiy» so'rov (text/plain, maxsus sarlavhasiz): brauzer oldindan OPTIONS (preflight) yubormaydi — tezroq va ishonchliroq.
      // Sessiya kaliti tanada yuboriladi; server JSON'ni baribir o'qiydi
      r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" },
        body: JSON.stringify(Object.assign({ action }, body || {}, S ? { token: S.token } : {})) });
    } catch (e) { return { ok: false, error: "NET" }; }
    let j; try { j = await r.json(); } catch (e) { return { ok: false, error: "SERVER" }; }
    if (j && (j.error === "LOGIN" || j.error === "NOT_ADMIN") && action !== "login") { logout(errText(j)); }
    // 🔢 muhim pul amali PIN so'rasa — PIN oynasi ochiladi va amal o'zi qayta bajariladi
    if (j && j.error === "PIN_KERAK" && action !== "pin" && !(body && body._pinRetry)) {
      if (await pinModal()) return api(action, Object.assign({}, body, { _pinRetry: true }));
    }
    return j;
  }
  function pinModal() {
    return new Promise((res) => {

      let done = false;
      const fin = (v) => { if (!done) { done = true; m.close(); res(v); } };
      $$("[data-x]", m.el).forEach((b) => b.onclick = () => fin(false));
      const go_ = async () => {
        const r = await api("pin", { pin: $("#pin", m.el).value });
        if (typeof c !== "undefined" && c && c.nodeType === 1 && !c.isConnected) return;
        if (r && r.ok) fin(true); else { toast(r && r.error === "WRONG_PIN" ? "❌ PIN noto'g'ri" + (r.left != null ? " (yana " + r.left + " urinish)" : "") : errText(r), true); $("#pin", m.el).value = ""; }
      };
      $("#pok", m.el).onclick = go_;
      $("#pin", m.el).onkeydown = (e) => { if (e.key === "Enter") go_(); };
      setTimeout(() => $("#pin", m.el).focus(), 50);
    });
  }

    c.innerHTML = '<div class="row between" style="margin-bottom:14px"><div><h1>' + (S_ ? "🛒 Sotuv savati" : "📖 Ijara savati") + '</h1><p class="sub" style="margin:0">' +
      (S_ ? "Kitob stikerini skanerlang — savatga qo'shiladi. Mijozsiz ham sotish mumkin." : "Mijozni tanlang va kitob stikerlarini skanerlang. Garov mijoz balansidan yoki naqd olinadi.") + "</p></div>" +

      '</div><div class="card pad" id="side2"></div></div>';
    const draw = () => {
      const x = cart;
      $("#items").innerHTML = x.items.length ? "<table><thead><tr><th>Kitob</th><th>Nusxa</th><th>" + (S_ ? "Narx" : "Garov") + "</th><th></th></tr></thead><tbody>" +
        x.items.map((it) => "<tr><td><b>" + esc(it.title) + "</b>" + (it.is_new ? ' <span class="pill p-ok">yangi</span>' : "") + (it.days ? '<div class="tiny muted">' + it.days + " kun · ijara haqi ~" + som(it.fee) + "</div>" : "") + '</td><td class="mono">' + esc(it.copy_code) + "</td>" +
          "<td>" + (S_ && Number(it.full_price) > Number(it.price) ? '<s class="muted small">' + fmt(it.full_price) + "</s> " : "") + "<b>" + som(S_ ? it.price : it.deposit) + '</b></td><td style="text-align:right"><button class="btn ghost sm" data-rm="' + it.copy_id + '">✕</button></td></tr>').join("") + "</tbody></table>"

          : '<div style="margin:8px 0;position:relative"><input class="input" id="cq" placeholder="Telefon, ism yoki mijoz kodi…" style="width:100%" autocomplete="off"><div id="cres" class="card" style="position:absolute;left:0;right:0;top:44px;z-index:5;display:none;max-height:260px;overflow:auto"></div>' +
            (S_ ? '<div class="tiny muted" style="margin-top:6px">Mijozsiz ham sotish mumkin (anonim).</div>' : "") + "</div>") +
        '<div style="margin-top:10px">' + (x.bundles || []).map((b) => '<div class="note t-ok small">📦 «' + esc(b.name) + "» to'plami: −" + som(b.discount) + "</div>").join("") +
        '<div class="sum-row"><span class="muted">' + x.items.length + " ta kitob</span><span>" + som(x.subtotal) + "</span></div>" +
        (Number(x.discount) ? '<div class="sum-row"><span class="muted">Chegirma</span><span style="color:var(--ok)">−' + som(x.discount) + "</span></div>" : "") +

  async function uploadCover(bookId, file) {

    const k_ = Math.min(1, 1200 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * k_); cv.height = Math.round(img.height * k_);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const r = await api("cover_upload", { book_id: bookId, image: cv.toDataURL("image/jpeg", 0.85) });
    if (typeof c !== "undefined" && c && c.nodeType === 1 && !c.isConnected) return;
    if (!r.ok) { toast(errText(r), true); return null; }

      '<div class="two"><div class="card pad"><b>🗄 Baza</b><div style="font-size:22px;font-weight:800;margin:6px 0">' + mb(r.db_bytes) + ' <span class="small muted">/ 500 MB</span></div><div style="height:10px;background:var(--bg);border-radius:6px;overflow:hidden"><div style="height:100%;width:' + Math.min(pct_, 100) + "%;background:" + (pct_ >= (r.alert_percent || 70) ? "var(--red)" : "var(--ok)") + '"></div></div><div class="tiny muted" style="margin-top:6px">' + pct_ + "% · ogohlantirish " + (r.alert_percent || 70) + "% da</div></div>" +
      '<div class="card pad"><b>🖼 Fayl ombori</b><div style="font-size:22px;font-weight:800;margin:6px 0">' + mb(r.storage_bytes) + ' <span class="small muted">/ 1024 MB</span></div><div class="tiny muted">Muqovalar va murojaat rasmlari</div></div></div>';
  };

  // ---------- ishga tushirish ----------
  if (S && ME) {
    renderApp();
    api("me").then((r) => { if (r && r.ok !== false && r.telegram_id) { ME = r; S.me = r; store.set(S); } });
  } else renderLogin();
})();
</script>
