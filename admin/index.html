<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RentBooks — Boshqaruv</title>
<!-- VERSIYA: v22 — 🖥 admin va kassir sayti (kompyuter uchun). Kirish: Telegram orqali -->
<style>
:root {
  --side: #1E1F2E; --side2: #26283A; --side-ink: #E9EAF2; --side-mut: #8F93AD; --side-line: #2F3247;
  --bg: #F4F5F8; --card: #fff; --line: #E4E6EC; --ink: #1C1E2A; --mut: #6B7085; --soft: #9A9EB2;
  --acc: #F0B54A; --acc-ink: #2A1E08; --blue: #3D5AFE; --blue-bg: #EEF1FF; --ok: #1E8E4E; --ok-bg: #E7F6EC;
  --warn: #B7791F; --warn-bg: #FFF5E0; --red: #C93A2B; --red-bg: #FDECEA; --r: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 14px/1.45 Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
.hidden { display: none !important; }

/* ---------- tuzilma ---------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--side-line); }
.brand .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; font-weight: 800; }
.brand b { display: block; font-size: 14px; } .brand span { font-size: 11.5px; color: var(--acc); font-weight: 700; }
.sgroup { padding: 14px 14px 4px; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--side-mut); text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 10px; margin: 2px 8px; padding: 9px 10px; border-radius: 9px; color: var(--side-ink); cursor: pointer; border: 0; background: none; width: calc(100% - 16px); text-align: left; font-weight: 600; }
.nav:hover { background: var(--side2); }
.nav.on { background: var(--side2); box-shadow: inset 3px 0 0 var(--acc); }
.nav svg { flex: none; opacity: .85; }
.nav > span:first-of-type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nav .badge { margin-left: auto; background: var(--acc); color: var(--acc-ink); border-radius: 10px; padding: 0 7px; font-size: 11.5px; font-weight: 800; }
.sgroup.tg { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; }
.sgroup.tg:hover { color: var(--side-ink); }
.sgroup.tg i { font-style: normal; transition: transform .15s; } .sgroup.tg.shut i { transform: rotate(-90deg); }
.nav .bot { margin-left: auto; font-size: 10px; font-weight: 800; color: var(--side-mut); border: 1px solid var(--side-line); border-radius: 6px; padding: 0 5px; }
.nav.dim span:first-of-type { color: var(--side-mut); }
.sfind { margin: 12px 12px 4px; display: flex; align-items: center; gap: 8px; background: var(--side2); border: 1px solid var(--side-line); border-radius: 9px; padding: 7px 10px; color: var(--side-mut); }
.sfind input { background: none; border: 0; outline: none; color: var(--side-ink); width: 100%; font-size: 13px; }
.sfind kbd { font: 700 10px/1.2 inherit; border: 1px solid var(--side-line); border-radius: 5px; padding: 2px 5px; white-space: nowrap; flex: none; }
.sfind svg { flex: none; }
.input::placeholder { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--soft); }
.paybtn { flex: 1; min-width: 110px; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; }
.paybtn.on { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.cart-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
.big-in { font-size: 18px; padding: 12px 14px; font-weight: 700; letter-spacing: .03em; }
.sum-row { display: flex; justify-content: space-between; padding: 6px 0; } .sum-row.tot { font-size: 18px; font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.side-foot { margin-top: auto; padding: 12px 16px; font-size: 11.5px; color: var(--side-mut); border-top: 1px solid var(--side-line); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { height: 58px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px; position: sticky; top: 0; z-index: 5; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; background: #fff; }
.chip .ab { width: 24px; height: 24px; border-radius: 7px; background: var(--blue-bg); color: var(--blue); display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.user { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.user b { display: block; font-size: 13px; } .user span { font-size: 11.5px; color: var(--mut); }
.burger { display: none; }
.content { padding: 22px; max-width: 1400px; width: 100%; }
h1 { font-size: 20px; margin: 0 0 4px; } .sub { color: var(--mut); margin: 0 0 18px; font-size: 13px; }

/* ---------- elementlar ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 16px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); }
.kpi { padding: 16px; display: flex; gap: 12px; align-items: center; cursor: default; }
.kpi.click { cursor: pointer; } .kpi.click:hover { border-color: var(--blue); }
.kpi .ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.kpi b { font-size: 21px; display: block; line-height: 1.15; white-space: nowrap; }
.kpi > div:last-child { min-width: 0; } .kpi span { color: var(--mut); font-size: 12.5px; }
.t-blue { background: var(--blue-bg); color: var(--blue); } .t-ok { background: var(--ok-bg); color: var(--ok); }
.t-warn { background: var(--warn-bg); color: var(--warn); } .t-red { background: var(--red-bg); color: var(--red); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.btn { border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 700; background: var(--blue); color: #fff; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.05); } .btn:disabled { opacity: .5; cursor: default; }
.btn.acc { background: var(--acc); color: var(--acc-ink); }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.red { background: var(--red); } .btn.ok { background: var(--ok); }
.btn.sm { padding: 6px 10px; font-size: 12.5px; border-radius: 8px; }
.input { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; min-width: 0; outline: none; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-bg); }
.search { flex: 1; min-width: 220px; max-width: 420px; }
.tabs { display: flex; gap: 6px; }
.tab { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
.tab.on { background: var(--blue); border-color: var(--blue); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--mut); font-weight: 800; padding: 11px 12px; border-bottom: 1px solid var(--line); background: #FAFBFC; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #FAFBFD; }
tr.click { cursor: pointer; }
.tw { overflow-x: auto; }
.muted { color: var(--mut); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-warn { background: var(--warn-bg); color: var(--warn); }
.p-red { background: var(--red-bg); color: var(--red); } .p-blue { background: var(--blue-bg); color: var(--blue); }
.p-gray { background: #EEF0F4; color: var(--mut); }
.empty { padding: 40px 16px; text-align: center; color: var(--mut); }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.kv:last-child { border-bottom: 0; } .kv span { color: var(--mut); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* modal */
.ov { position: fixed; inset: 0; background: rgba(20, 22, 36, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow-y: auto; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal.wide { max-width: 860px; }
.mh { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.mh b { font-size: 16px; } .mb { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.mf { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--mut); line-height: 1; }
.note { border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.code-in { font-size: 26px; letter-spacing: .4em; text-align: center; font-weight: 800; width: 100%; }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 12px; z-index: 80; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.toast.err { background: var(--red); }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 10px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar .b2 { display: flex; gap: 3px; align-items: flex-end; width: 100%; justify-content: center; flex: 1; }
.bar i { display: block; width: 40%; max-width: 22px; border-radius: 5px 5px 0 0; min-height: 2px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--mut); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* kirish */
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: linear-gradient(135deg, var(--side) 0%, #2B2F4A 100%); }
.lbox { background: #fff; border-radius: 18px; padding: 30px 28px; width: 100%; max-width: 400px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.lbox .logo { width: 56px; height: 56px; border-radius: 14px; background: var(--acc); color: var(--acc-ink); display: grid; place-items: center; font-weight: 900; font-size: 22px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; z-index: 60; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; }
  .burger { display: inline-flex; }
  .two, .three, .cart-grid { grid-template-columns: 1fr; }
  .content { padding: 14px; }
  .top { padding: 0 12px; }
  .user > div { display: none; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: 12px; gap: 10px; } .kpi b { font-size: 18px; } .kpi .ic { width: 36px; height: 36px; }
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hidden"></div>
<script>
/* ⚙️ SOZLASH — 2 qator (javon.html dagi bilan bir xil Supabase manzili) */
const CONFIG = {
  SUPABASE_URL: "https://cyvrjjqzevyqcvxadjay.supabase.co",   // Supabase → Project Settings → Data API → Project URL
  BOT_USERNAME: "Kitobijarabot",                         // @ belgisisiz. BotFather → /setdomain → shu sayt manzili
  IDLE_MINUTES: 30,                                      // shuncha daqiqa harakatsizlikdan keyin avtomatik chiqadi
};
(function () {
  "use strict";
  const VER = "v22";
  const API = (window.RB_API || CONFIG.SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/admin");
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (n) => String(Math.round(Number(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const som = (n) => fmt(n) + " so'm";
  const dt = (s, short) => {
    if (!s) return "—";
    const d = new Date(s), p = (x) => String(x).padStart(2, "0");
    const t = new Date(d.toLocaleString("en-US", { timeZone: "Asia/Tashkent" }));
    return p(t.getDate()) + "." + p(t.getMonth() + 1) + (short ? "" : "." + t.getFullYear()) + " " + p(t.getHours()) + ":" + p(t.getMinutes());
  };
  const ERR = {
    LOGIN: "Sessiya tugadi — qayta kiring.", NOT_ADMIN: "⛔ Siz xodimlar ro'yxatida yo'qsiz (👥 adminlar → faol).",
    BAD_SIGN: "🔐 Telegram imzosi tasdiqlanmadi. Qayta urinib ko'ring.", RUXSAT_YOQ: "⛔ Bu amal uchun vakolatingiz yo'q (👥 adminlar galochkasi).",
    ADMIN_BLOK: "⛔ Siz bloklangansiz (PIN). Superadminga murojaat qiling.", TOO_MANY: "⏳ Juda tez — biroz kuting.",
    PUL_TOXTATILGAN: "🚨 Pul amallari vaqtincha to'xtatilgan.", KODSIZ_CHEGARA: "⛔ Bugungi kodsiz amallar chegarasiga yetdingiz.",
    CODE_REQUIRED: "🔐 Mijoz tasdiqlash kodi kerak (yoki «kodsiz» sababi).", WRONG_CODE: "❌ Kod noto'g'ri.",
    CODE_EXPIRED: "⌛ Kod muddati tugadi — yangisini yuboring.", NO_CODE: "Avval kod yuboring.", ALREADY: "ℹ️ Bu bron allaqachon ko'rib chiqilgan.",
    STAFF_SELF: "👥 Imtiyozli kitobni o'zingizga o'zingiz bera olmaysiz — boshqa xodim bajarsin.",
    STAFF_LIMIT: "👥 Xodim imtiyozi chegarasi.", STAFF_OVERDUE: "👥 Xodimning muddati o'tgan kitobi bor.",
    IN_DELIVERY: "🛵 Kitob kuryerda — bekor qilib bo'lmaydi.", BUSY: "Nusxa band.", NOT_FOUND: "Topilmadi.",
    DB: "Bazada xatolik.", SERVER: "Serverda xatolik.", NET: "📶 Serverga ulanib bo'lmadi.", BAD_ID: "Noto'g'ri so'rov.",
    UNKNOWN_ACTION: "Darvoza eski — Supabase'ga «admin» funksiyasini qayta deploy qiling.",
    PIN_YOQ: "🔢 PIN-kod o'rnatilmagan. Botda: ⚙️ Sozlamalar → 🔢 PIN-kod.", PIN_KERAK: "🔢 PIN-kod kerak.",
    CASH_LOW: "💵 Kassangizda buncha naqd yo'q.", EMPTY: "Savat bo'sh.", NO_CUSTOMER: "Avval mijozni tanlang.",
    BALANCE: "Mijoz balansida mablag' yetmaydi.", LIMIT: "Mijozning ijaradagi kitoblari chegarasiga yetdi.", DEBT: "Mijozning qarzi bor — avval qarz to'lansin.",
    ORIGIN: "⛔ Bu saytdan so'rov qabul qilinmaydi (ADMIN_ORIGINS).", BAD_AMOUNT: "Summa noto'g'ri.", BAD_TYPE: "Noto'g'ri tur.",
    NOT_SELLABLE: "Bu nusxani sotib bo'lmaydi.", MODE_RENT_ONLY: "Bu kitob faqat ijaraga beriladi.", MODE_SALE_ONLY: "Bu kitob faqat sotiladi.",
    NEED_TWO: "🔐 Bu summa uchun ikkinchi superadmin tasdig'i kerak (botda).", NEEDS_APPROVAL: "🔐 Ikkinchi admin tasdig'i kerak — so'rov yuborildi.",
    NO_COURIER: "Kuryer tanlanmagan.", WRONG_PIN: "❌ PIN noto'g'ri.", PIN_WEAK: "PIN juda oddiy (1234, 1111 kabi) — boshqa raqam tanlang.", BAD_PIN: "PIN 4–8 ta raqam bo'lsin.", PIN_FORMAT: "PIN 4–8 ta raqam bo'lsin.", LOCKED: "⛔ PIN bloklangan — superadmin ochishi kerak.", NO_PIN: "PIN o'rnatilmagan.", PROMO_BAD_CODE: "Promokod: 3–24 belgi, lotin harflari, raqam, - va _.", PROMO_EXISTS: "Bunday promokod bor.", BAD_PCT: "Foiz noto'g'ri (1–90).", TG_SEND: "Telegram xabarni qabul qilmadi.", SELF_APPROVE: "O'zingiz so'ragan amalni o'zingiz tasdiqlay olmaysiz.", TOO_LATE: "⌛ Bekor qilish muddati o'tdi.",
    UNDO_BALANCE: "↩️ Bekor qilib bo'lmaydi: mijoz puli allaqachon ishlatilgan.", NOTE_REQUIRED: "Izoh yozing (kamida 3 belgi).", NO_TITLE: "Nomini yozing.", BAD_COST: "Tannarx noto'g'ri.", BAD_COPIES: "Nusxalar soni 1–100.", BAD_PHOTO: "Rasm yuklanmadi.", OTHER_COURIER: "Boshqa kuryer qabul qilgan.", BAD_DAYS: "Sana oralig'i noto'g'ri.",
  };
  const errText = (r) => {
    if (!r) return ERR.NET;
    let t = ERR[r.error] || r.error || "Xatolik";
    if (r.error === "WRONG_CODE" && r.left != null) t += " Yana " + r.left + " ta urinish.";
    if (r.error === "STAFF_LIMIT" && r.limit) t += " (ko'pi bilan " + r.limit + " ta)";
    return t;
  };
  let tt;
  function toast(msg, err) {
    const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); clearTimeout(tt);
    tt = setTimeout(() => t.classList.add("hidden"), err ? 6000 : 3500);
  }

  // ---------- sessiya ----------
  const store = {
    get() { try { const o = JSON.parse(localStorage.getItem("rb_admin") || "null"); return o && o.exp > Date.now() ? o : null; } catch (e) { return null; } },
    set(o) { try { localStorage.setItem("rb_admin", JSON.stringify(o)); } catch (e) {} },
    clear() { try { localStorage.removeItem("rb_admin"); } catch (e) {} },
  };
  let S = store.get(), ME = S ? S.me : null;
  async function api(action, body) {
    let r;
    try {
      r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", ...(S ? { "x-admin-token": S.token } : {}) },
        body: JSON.stringify(Object.assign({ action }, body || {})) });
    } catch (e) { return { ok: false, error: "NET" }; }
    let j; try { j = await r.json(); } catch (e) { return { ok: false, error: "SERVER" }; }
    if (j && (j.error === "LOGIN" || j.error === "NOT_ADMIN") && action !== "login") { logout(errText(j)); }
    // 🔢 muhim pul amali PIN so'rasa — PIN oynasi ochiladi va amal o'zi qayta bajariladi
    if (j && j.error === "PIN_KERAK" && action !== "pin" && !(body && body._pinRetry)) {
      if (await pinModal()) return api(action, Object.assign({}, body, { _pinRetry: true }));
    }
    return j;
  }
  function pinModal() {
    return new Promise((res) => {
      const m = modal("🔢 PIN-kod", '<p class="small muted" style="margin:0">Bu amal uchun botdagi PIN-kodingizni kiriting (bir muddat qayta so\'ralmaydi).</p>' +
        '<input class="input code-in" id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">',
        '<button class="btn ghost" data-x>Bekor</button><button class="btn" id="pok">Tasdiqlash</button>');
      let done = false;
      const fin = (v) => { if (!done) { done = true; m.close(); res(v); } };
      $$("[data-x]", m.el).forEach((b) => b.onclick = () => fin(false));
      const go_ = async () => {
        const r = await api("pin", { pin: $("#pin", m.el).value });
        if (typeof c !== "undefined" && c && c.nodeType === 1 && !c.isConnected) return;
        if (r && r.ok) fin(true); else { toast(r && r.error === "WRONG_PIN" ? "❌ PIN noto'g'ri" + (r.left != null ? " (yana " + r.left + " urinish)" : "") : errText(r), true); $("#pin", m.el).value = ""; }
      };
      $("#pok", m.el).onclick = go_;
      $("#pin", m.el).onkeydown = (e) => { if (e.key === "Enter") go_(); };
      setTimeout(() => $("#pin", m.el).focus(), 50);
    });
  }
  // ⏱ v22: faolsizlikda avtomatik chiqish (sichqoncha/klaviatura harakati bo'lmasa)
  const IDLE_MIN = Number(CONFIG.IDLE_MINUTES || 30);
  let lastAct = Date.now();
  ["mousedown", "keydown", "wheel", "touchstart"].forEach((ev) => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
  setInterval(() => { if (ME && Date.now() - lastAct > IDLE_MIN * 60e3) logout("⏱ " + IDLE_MIN + " daqiqa harakatsizlik — xavfsizlik uchun chiqildi."); }, 20000);
  function logout(msg) { store.clear(); S = null; ME = null; renderLogin(msg); }

  // ---------- ikonkalar ----------

  async function uploadCover(bookId, file) {

    const k_ = Math.min(1, 1200 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
    cv.width = Math.round(img.width * k_); cv.height = Math.round(img.height * k_);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    const r = await api("cover_upload", { book_id: bookId, image: cv.toDataURL("image/jpeg", 0.85) });
    if (typeof c !== "undefined" && c && c.nodeType === 1 && !c.isConnected) return;
    if (!r.ok) { toast(errText(r), true); return null; }
    toast("🖼 Muqova yuklandi"); return r;
  }

    $$("[data-rb]", c).forEach((tr) => tr.onclick = async () => { const x = await call("reviews_admin", { p_book_id: +tr.dataset.rb }); const rv = x.items || [];
      const m = modal("⭐ Sharhlar", rv.length ? rv.map((y) => '<div class="kv"><span>' + "⭐".repeat(y.stars || 0) + " " + esc(y.name || "") + '<div class="small" style="color:var(--ink)">' + esc(y.text || "") + '</div></span><span>' + (y.hidden ? '<span class="pill p-gray">yashirin</span>' : '<button class="btn ghost sm" data-hid="' + y.id + '">Yashirish</button>') + "</span></div>").join("") : '<div class="empty">Sharh yo\'q</div>');
      $$("[data-hid]", m.el).forEach((b) => b.onclick = async () => { const z = await call("review_hide", { p_id: +b.dataset.hid }); if (z.ok === false) return toast(errText(z), true); b.replaceWith(Object.assign(document.createElement("span"), { className: "pill p-gray", textContent: "yashirin" })); }); });
  };

  // 🔢 PIN-kod va 🌙 tungi tinchlik (har bir xodim o'zi uchun)
  VIEWS["b:pin"] = async (c) => {
    const r = await call("web_my_settings"); if (r.ok === false) return errBox(c, r);
    const pn = r.pin || {}, q = r.quiet || {};
    const hrs = Array.from({ length: 24 }, (_, i) => [i, String(i).padStart(2, "0") + ":00"]);
    c.innerHTML = head("PIN-kod va tungi tinchlik", "Botda ham, saytda ham bir xil ishlaydi.") + '<div class="two"><div class="card pad" style="display:flex;flex-direction:column;gap:10px"><b>🔢 PIN-kod</b>' +
      '<div class="small muted">' + (pn.has_pin ? "PIN o'rnatilgan." : "PIN hali o'rnatilmagan — pul amallari uchun kerak.") + (pn.locked ? ' <span class="pill p-red">bloklangan</span>' : "") + "</div>" +
      (pn.has_pin ? field("po", "Hozirgi PIN", "", 'type="password" inputmode="numeric" maxlength="8"') : "") + field("pn", "Yangi PIN (4–8 raqam)", "", 'type="password" inputmode="numeric" maxlength="8"') + field("pn2", "Yangi PIN (qayta)", "", 'type="password" inputmode="numeric" maxlength="8"') +
      '<button class="btn" id="psv">Saqlash</button></div>' +
      '<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><b>🌙 Tungi tinchlik</b><div class="small muted">Shu vaqt oralig\'ida bot bildirishnoma yubormaydi — ertalab to\'planib keladi.</div><div class="two">' +
      sel("qf", "Dan", [["", "— o'chiq —"]].concat(hrs), q.from == null ? "" : q.from) + sel("qt", "Gacha", [["", "— o'chiq —"]].concat(hrs), q.to == null ? "" : q.to) + '</div><button class="btn" id="qsv">Saqlash</button></div></div>';
    $("#psv").onclick = async () => { const n = $("#pn").value; if (!/^\d{4,8}$/.test(n)) return toast("PIN 4–8 ta raqam bo'lsin", true); if (n !== $("#pn2").value) return toast("PIN'lar mos emas", true);
      const x = await call("admin_pin_set", { p_old: $("#po") ? $("#po").value : null, p_new: n }); if (x.ok === false) return toast(x.error === "WRONG_PIN" ? "❌ Hozirgi PIN noto'g'ri" : errText(x), true); toast("✅ PIN saqlandi"); VIEWS["b:pin"](c); };
    $("#qsv").onclick = async () => { const f = $("#qf").value, t = $("#qt").value; const x = await call("admin_quiet_set", { p_from: f === "" ? null : +f, p_to: t === "" ? null : +t }); if (x.ok === false) return toast(errText(x), true); toast("✅ Saqlandi"); };
  };
  VIEWS["b:quiet"] = (c) => VIEWS["b:pin"](c);

  // ✅ Vazifalar
  VIEWS["b:tasks"] = async (c) => {
    const [r, me_] = await Promise.all([call("task_list", { p_all: true }), call("web_my_settings")]);
    if (r.ok === false) return errBox(c, r);
    const it = r.items || [], staff = me_.staff || [];
    c.innerHTML = head("Vazifalar", "Xodimlarga topshiriq: muddati kelganda botda eslatma boradi.", '<button class="btn" id="new">➕ Vazifa</button>') + '<div class="card tw">' +
      (it.length ? "<table><thead><tr><th>Vazifa</th><th>Kimga</th><th>Muddat</th><th>Kim berdi</th><th></th></tr></thead><tbody>" + it.map((x) => "<tr><td><b>" + esc(x.title) + "</b></td><td>" + esc(x.assignee || "hamma") + '</td><td class="small">' + (x.due_at ? '<span class="pill ' + (x.overdue ? "p-red" : "p-gray") + '">' + dt(x.due_at, true) + "</span>" : "—") + '</td><td class="small">' + esc(x.by || "") + '</td><td style="white-space:nowrap"><button class="btn ok sm" data-dn="' + x.id + '">✅ Bajarildi</button> <button class="btn ghost sm" data-cn="' + x.id + '">✕</button></td></tr>').join("") + "</tbody></table>" : '<div class="empty">✅ Ochiq vazifa yo\'q</div>') + "</div>";
    $$("[data-dn],[data-cn]", c).forEach((b) => b.onclick = async () => { const x = await call("task_done", { p_id: +(b.dataset.dn || b.dataset.cn), p_cancel: !!b.dataset.cn }); if (x.ok === false) return toast(errText(x), true); VIEWS["b:tasks"](c); });
    $("#new").onclick = () => formModal("✅ Yangi vazifa", field("tt", "Vazifa", "") + sel("ta", "Kimga", [["", "Hammaga / o'zimga"]].concat(staff.map((s_) => [s_.tg, s_.name])), "") + field("td", "Muddat (ixtiyoriy)", "", 'type="datetime-local"'),
      async (m) => { const x = await call("task_create", { p_title: $("#tt", m.el).value.trim(), p_assignee: $("#ta", m.el).value ? +$("#ta", m.el).value : null, p_due: $("#td", m.el).value ? new Date($("#td", m.el).value).toISOString() : null }); if (x.ok !== false) { toast("✅ Vazifa qo'shildi"); VIEWS["b:tasks"](c); } return x; });
  };

  // 💼 Maosh sozlamalari (superadmin)
  VIEWS["b:sal"] = async (c) => {
    const r = await call("salary_staff"); if (r.ok === false) return errBox(c, r);
    const it = r.items || [];
    c.innerHTML = head("Maosh sozlamalari", "Oklad va foizlar: ijara foizi — xodim bergan kitoblarning (qaytgach) ijara haqidan, sotuv foizi — xodim sotgan kitoblar narxidan.") + '<div class="card tw"><table><thead><tr><th>Xodim</th><th>Oklad, so\'m</th><th>Ijara foizi, %</th><th>Sotuv foizi, %</th></tr></thead><tbody>' +
      it.map((x) => "<tr><td><b>" + esc(x.name) + '</b><div class="tiny muted">' + esc(x.rol) + "</div></td>" + [["oklad", x.oklad, 1000], ["ijara_foiz", x.ijara_foiz, 0.5], ["sotuv_foiz", x.sotuv_foiz, 0.5]].map((f) => '<td><input class="input" type="number" min="0" step="' + f[2] + '" value="' + Number(f[1]) + '" data-sal="' + x.telegram_id + '" data-f="' + f[0] + '" style="width:130px"></td>').join("") + "</tr>").join("") + "</tbody></table></div>" +
      '<p class="tiny muted">Qiymatni o\'zgartirib, maydondan chiqing — darhol saqlanadi.</p>';
    $$("[data-sal]", c).forEach((inp) => { const v0 = inp.value; inp.onchange = async () => { const x = await call("salary_set", { p_tg: +inp.dataset.sal, p_field: inp.dataset.f, p_value: +inp.value }); if (x.ok === false) { inp.value = v0; return toast(errText(x), true); } toast("✅ Saqlandi"); }; });
  };

  // ⚙️ Umumiy sozlamalar (superadmin)
  VIEWS["b:set"] = async (c) => {
    const r = await call("web_settings"); if (r.ok === false) return errBox(c, r);
    const it = r.items || [];
    c.innerHTML = head("Umumiy sozlamalar", "Bot, Mini App va sayt shu qiymatlar bilan ishlaydi. Har o'zgarish tarixga yoziladi.", '<input class="input search" id="q" placeholder="Qidirish: kalit yoki izoh…">') + '<div class="card tw" id="tb"></div>';
    const draw = () => { const q = $("#q").value.trim().toLowerCase();
      $("#tb").innerHTML = "<table><thead><tr><th>Sozlama</th><th>Qiymat</th></tr></thead><tbody>" + it.filter((x) => !q || x.key.includes(q) || String(x.note).toLowerCase().includes(q)).map((x) => '<tr><td><b class="mono small">' + esc(x.key) + '</b><div class="small muted">' + esc(x.note) + '</div></td><td style="width:170px">' + (x.key === "pul_amallari" ? '<span class="tiny muted">«Favqulodda» bo\'limida</span>' : '<input class="input" type="number" min="0" step="any" value="' + Number(x.value) + '" data-k="' + esc(x.key) + '" style="width:150px">') + "</td></tr>").join("") + "</tbody></table>";
      $$("[data-k]", c).forEach((inp) => { const v0 = inp.value; inp.onchange = async () => { const x = await call("web_setting_set", { p_key: inp.dataset.k, p_value: +inp.value }); if (x.ok === false) { inp.value = v0; return toast(errText(x), true); } const it_ = it.find((y) => y.key === inp.dataset.k); if (it_) it_.value = +inp.value; toast("✅ " + inp.dataset.k + ": " + fmt(x.old) + " → " + fmt(x.value)); }; }); };
    $("#q").oninput = debounce(draw, 150); draw();
  };

  // 🚨 Favqulodda (superadmin): pul amallarini to'xtatish, bloklangan xodimlar
  VIEWS["b:emg"] = async (c) => {
    const r = await call("web_emergency"); if (r.ok === false) return errBox(c, r);
    c.innerHTML = head("Favqulodda", "Shubhali holatda barcha pul amallarini darhol to'xtatish (bot, Mini App va sayt).") +
      '<div class="card pad" style="border-color:' + (r.money_on ? "var(--line)" : "var(--red)") + '"><div class="row between"><div><b style="font-size:16px">' + (r.money_on ? "✅ Pul amallari ishlayapti" : "🚨 Pul amallari TO'XTATILGAN") + '</b><div class="small muted">To\'xtatilsa: balans o\'zgartirish, pul yechish, naqd topshirish va boshqa pul amallari bajarilmaydi.</div></div>' +
      '<button class="btn ' + (r.money_on ? "red" : "ok") + '" id="sw">' + (r.money_on ? "🚨 To'xtatish" : "✅ Qayta yoqish") + "</button></div></div>" +
      '<div class="card tw" style="margin-top:14px"><div class="pad" style="padding-bottom:0"><b>👥 Xodimlar</b></div><table><thead><tr><th>Xodim</th><th>Rol</th><th>PIN</th><th>Tungi tinchlik</th><th></th></tr></thead><tbody>' +
      (r.admins || []).map((a) => { const lk = (r.locked || []).some((l) => l.tg === a.tg); return "<tr><td><b>" + esc(a.name) + "</b>" + (a.faol ? "" : ' <span class="pill p-gray">nofaol</span>') + "</td><td>" + esc(a.rol) + "</td><td>" + (lk ? '<span class="pill p-red">bloklangan</span>' : a.has_pin ? "✅" : '<span class="muted">—</span>') + '</td><td class="small">' + esc(a.quiet || "—") + "</td><td>" + (lk ? '<button class="btn ghost sm" data-ul="' + a.tg + '">🔓 Blokdan chiqarish</button>' : "") + "</td></tr>"; }).join("") + "</tbody></table></div>";
    $("#sw").onclick = async () => { if (!confirm(r.money_on ? "Barcha pul amallari to'xtatilsinmi?" : "Pul amallari qayta yoqilsinmi?")) return; const x = await call("money_switch", { p_on: !r.money_on }); if (x.ok === false) return toast(errText(x), true); toast(r.money_on ? "🚨 To'xtatildi" : "✅ Yoqildi"); VIEWS["b:emg"](c); };
    $$("[data-ul]", c).forEach((b) => b.onclick = async () => { const x = await call("admin_pin_unlock", { p_tg: +b.dataset.ul, p_reset: false }); if (x.ok === false) return toast(errText(x), true); toast("🔓 Blokdan chiqarildi"); VIEWS["b:emg"](c); });
  };

  // 🗄 Baza va zaxira
  VIEWS["b:dbu"] = async (c) => {
    const r = await call("db_usage"); if (r.ok === false) return errBox(c, r);
    const mb = (b_) => (Number(b_ || 0) / 1048576).toFixed(1) + " MB";
    const lim = 500 * 1048576, pct_ = Math.round(Number(r.db_bytes) / lim * 100);
    c.innerHTML = head("Baza va zaxira", "Supabase bepul tarifi: baza 500 MB, fayl ombori 1 GB. Har kecha 23:30 bot bazani zaxira kanaliga yuboradi.") +
      '<div class="two"><div class="card pad"><b>🗄 Baza</b><div style="font-size:22px;font-weight:800;margin:6px 0">' + mb(r.db_bytes) + ' <span class="small muted">/ 500 MB</span></div><div style="height:10px;background:var(--bg);border-radius:6px;overflow:hidden"><div style="height:100%;width:' + Math.min(pct_, 100) + "%;background:" + (pct_ >= (r.alert_percent || 70) ? "var(--red)" : "var(--ok)") + '"></div></div><div class="tiny muted" style="margin-top:6px">' + pct_ + "% · ogohlantirish " + (r.alert_percent || 70) + "% da</div></div>" +
      '<div class="card pad"><b>🖼 Fayl ombori</b><div style="font-size:22px;font-weight:800;margin:6px 0">' + mb(r.storage_bytes) + ' <span class="small muted">/ 1024 MB</span></div><div class="tiny muted">Muqovalar va murojaat rasmlari</div></div></div>';
  };

  // ---------- ishga tushirish ----------
  if (S && ME) {
    renderApp();
    api("me").then((r) => { if (r && r.ok !== false && r.telegram_id) { ME = r; S.me = r; store.set(S); } });
  } else renderLogin();
})();
</script>
</body>
</html>
